server {
    listen 3001;
    server_name _;

    # Admin frontend
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls desde el browser → admin-api container
    location /admin/api/ {
        proxy_pass http://admin-api:9004/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 '{"status":"ok","service":"admin-frontend"}';
        add_header Content-Type application/json;
    }
}
