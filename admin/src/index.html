<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>teremoqwow Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --border: #2a2a3a;
      --text: #e0e0f0; --muted: #888; --accent: #4fc3f7;
      --green: #4caf50; --red: #ef5350; --yellow: #ffc107;
      --sidebar-w: 220px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
               display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar header { padding: 1.25rem 1rem; border-bottom: 1px solid var(--border); }
    #sidebar header h1 { font-size: 1rem; color: var(--accent); }
    #sidebar header p  { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    #sidebar nav { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
    .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1rem;
                font-size: 0.85rem; cursor: pointer; border-left: 3px solid transparent;
                transition: background 0.15s; }
    .nav-item:hover { background: rgba(79,195,247,0.08); }
    .nav-item.active { border-left-color: var(--accent); background: rgba(79,195,247,0.12); color: var(--accent); }
    #sidebar footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
              display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; flex-shrink: 0; }
    #topbar .title { font-size: 1rem; font-weight: 600; }
    #topbar .user  { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.75rem; }
    #topbar .logout-btn { background: none; border: 1px solid var(--border); color: var(--text);
                          padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    #topbar .logout-btn:hover { border-color: var(--red); color: var(--red); }
    #content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    /* Login */
    #login-screen { position: fixed; inset: 0; background: var(--bg);
                    display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                 padding: 2rem; width: 360px; }
    .login-box h2 { margin-bottom: 1.5rem; color: var(--accent); }
    .form-field { margin-bottom: 1rem; }
    .form-field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-field input { width: 100%; background: var(--bg); border: 1px solid var(--border);
                        color: var(--text); padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.9rem; }
    .form-field input:focus { outline: none; border-color: var(--accent); }
    .btn-primary { width: 100%; background: var(--accent); color: #000; font-weight: 600;
                   border: none; padding: 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .btn-primary:hover { opacity: 0.9; }
    .error-msg { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; }
    /* Cards / grid */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .card .value { font-size: 1.5rem; font-weight: 700; }
    .card .value.green { color: var(--green); }
    .card .value.red   { color: var(--red); }
    .card .value.yellow { color: var(--yellow); }
    /* Table */
    .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; }
    .badge.green  { background: rgba(76,175,80,0.2); color: var(--green); }
    .badge.red    { background: rgba(239,83,80,0.2); color: var(--red); }
    .badge.yellow { background: rgba(255,193,7,0.2); color: var(--yellow); }
    .badge.blue   { background: rgba(79,195,247,0.2); color: var(--accent); }
    /* Buttons */
    .btn { padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
           border: 1px solid var(--border); background: none; color: var(--text); }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: rgba(239,83,80,0.1); }
    .flag-row { display: flex; align-items: center; justify-content: space-between;
                padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .slider::before { content:""; position:absolute; height:14px; width:14px; left:3px; bottom:3px;
                      background:#fff; border-radius:50%; transition:0.2s; }
    input:checked + .slider { background: var(--green); }
    input:checked + .slider::before { transform: translateX(16px); }
    .loading { color: var(--muted); font-size: 0.85rem; padding: 2rem 0; text-align: center; }
    .alert-item { background: rgba(239,83,80,0.1); border: 1px solid rgba(239,83,80,0.3);
                  border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .alert-item .aname { font-weight: 600; color: var(--red); }
    iframe.grafana { width: 100%; height: 600px; border: none; border-radius: 8px;
                     background: var(--surface); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>⚡ teremoqwow Admin</h2>
    <div class="form-field">
      <label>Email</label>
      <input id="login-email" type="email" value="admin@teremoqwow.dev" />
    </div>
    <div class="form-field">
      <label>Password</label>
      <input id="login-password" type="password" value="dev-secret" />
    </div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <header>
    <h1>⚡ teremoqwow</h1>
    <p>Admin panel</p>
  </header>
  <nav id="nav">
    <div class="nav-item active" data-page="broadcasts" onclick="navigate(this)">📡 Broadcasts</div>
    <div class="nav-item" data-page="federation" onclick="navigate(this)">🌐 Federación</div>
    <div class="nav-item" data-page="drm" onclick="navigate(this)">🔒 DRM / Rights</div>
    <div class="nav-item" data-page="monetization" onclick="navigate(this)">💳 Monetización</div>
    <div class="nav-item" data-page="qos" onclick="navigate(this)">📊 QoS</div>
    <div class="nav-item" data-page="security" onclick="navigate(this)">🛡️ Seguridad</div>
    <div class="nav-item" data-page="flags" onclick="navigate(this)">🚩 Feature Flags</div>
    <div class="nav-item" data-page="audit" onclick="navigate(this)">📋 Auditoría</div>
  </nav>
  <footer id="sidebar-user">—</footer>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <span class="title" id="page-title">Broadcasts</span>
    <span class="user">
      <span id="user-email"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </span>
  </div>
  <div id="content"><div class="loading">Cargando...</div></div>
</div>

<script>
const API = window.ADMIN_API_URL || 'http://localhost:9004';
let token = localStorage.getItem('admin_token') || '';
let currentPage = 'broadcasts';

const pages = {
  broadcasts:   { title: 'Broadcasts',   load: loadBroadcasts },
  federation:   { title: 'Federación',   load: loadFederation },
  drm:          { title: 'DRM / Rights', load: loadDRM },
  monetization: { title: 'Monetización', load: loadMonetization },
  qos:          { title: 'QoS',          load: loadQoS },
  security:     { title: 'Seguridad',    load: loadSecurity },
  flags:        { title: 'Feature Flags',load: loadFlags },
  audit:        { title: 'Auditoría',    load: loadAudit },
};

async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  if (r.status === 401) { logout(); throw new Error('401'); }
  return r;
}

async function login() {
  const email = document.getElementById('login-email').value;
  const pass  = document.getElementById('login-password').value;
  const authUrl = window.AUTH_URL || 'http://localhost:9002';
  try {
    const r = await fetch(`${authUrl}/auth/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass}),
    });
    if (!r.ok) { document.getElementById('login-error').textContent = 'Credenciales inválidas'; return; }
    const data = await r.json();
    // Verificar rol admin
    const payload = JSON.parse(atob(data.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (!['admin','superadmin','operator','analyst'].includes(payload.role)) {
      document.getElementById('login-error').textContent = 'Acceso denegado: rol insuficiente';
      return;
    }
    token = data.access_token;
    localStorage.setItem('admin_token', token);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('user-email').textContent = payload.email;
    document.getElementById('sidebar-user').textContent = `${payload.role} · ${payload.email}`;
    loadPage(currentPage);
  } catch(e) {
    document.getElementById('login-error').textContent = 'Error de conexión con Auth API';
  }
}

function logout() {
  token = ''; localStorage.removeItem('admin_token');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').textContent = '';
}

function navigate(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const page = el.dataset.page;
  currentPage = page;
  document.getElementById('page-title').textContent = pages[page].title;
  loadPage(page);
}

function loadPage(page) {
  document.getElementById('content').innerHTML = '<div class="loading">Cargando...</div>';
  pages[page].load();
}

function setContent(html) { document.getElementById('content').innerHTML = html; }

// ── Broadcasts ───────────────────────────────────────────────────────────────
async function loadBroadcasts() {
  const [r, srcR] = await Promise.all([
    api('/admin/broadcasts'),
    api('/admin/monitor/source?broadcast=anon/live1'),
  ]);
  const data   = await r.json();
  const source = await srcR.json();
  const playerUrl = window.PLAYER_URL || 'http://localhost:5173';
  const isLive = source.broadcasting;
  const rows = data.map(b => `
    <tr>
      <td><code>${b.id}</code>${b.simulated?'<span class="badge yellow" style="margin-left:4px">sim</span>':''}</td>
      <td><span class="badge ${b.status==='active'?'green':b.status==='stopped'?'yellow':'red'}">${b.status}</span></td>
      <td>${(b.bitrate_kbps/1000).toFixed(1)} Mbps</td>
      <td>${b.viewers}</td>
      <td>${b.encoder||'—'}</td>
      <td style="display:flex;gap:4px">
        ${b.status==='active'
          ? `<button class="btn danger" onclick="killBroadcast('${b.id}')">Kill</button>
             <button class="btn danger" onclick="stopInject('${b.id}')">⏹ Parar</button>`
          : '<button class="btn" onclick="injectBroadcast(\'' + b.id + '\', 4000)">▶ Reinyectar</button>'}
      </td>
    </tr>`).join('');
  const pulseStyle = isLive
    ? 'width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.5s infinite'
    : 'width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block';
  const tracks = (source.tracks||[]).map(t=>`<code style="margin-right:6px;font-size:0.75rem">${t}</code>`).join('');

  setContent(`
    <div style="display:grid;grid-template-columns:1fr 320px;gap:1.25rem;margin-bottom:1.25rem">
      <!-- Player consumer -->
      <div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.6rem">
          <span style="${pulseStyle}"></span>
          <span style="font-weight:600;font-size:0.9rem;color:${isLive?'var(--green)':'var(--red)'}">
            ${isLive?'EN VIVO':'SIN SEÑAL'}
          </span>
          <span style="font-size:0.75rem;color:var(--muted)">${source.broadcast}</span>
          ${tracks}
        </div>
        <div style="position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--border)">
          <iframe src="${playerUrl}"
            style="width:100%;height:100%;border:none"
            allow="autoplay"
            sandbox="allow-scripts allow-same-origin">
          </iframe>
          ${!isLive?`<div style="position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)">
            <div style="font-size:2rem;margin-bottom:0.5rem">📡</div>
            <div style="font-size:0.85rem">Sin señal — inyecta un stream primero</div>
          </div>`:''}
        </div>
        <!-- URL pública -->
        <div style="margin-top:0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.75rem;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:0.75rem;color:var(--muted)">URL para ver la señal:</span>
          <a href="${playerUrl}" target="_blank" style="color:var(--accent);font-size:0.82rem;font-family:monospace">${playerUrl}</a>
          <button class="btn" style="font-size:0.75rem;padding:2px 8px" onclick="navigator.clipboard.writeText('${playerUrl}').then(()=>this.textContent='✓').catch(()=>{})">Copiar</button>
        </div>
      </div>
      <!-- Panel lateral: origen + inyector -->
      <div>
        <div class="section-title" style="margin-bottom:0.6rem">Inyectar stream</div>
        <div class="card" style="margin-bottom:0.75rem">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.6rem">
            <div><div style="font-size:0.72rem;color:var(--muted);margin-bottom:3px">Broadcast</div>
              <input id="inj-id" value="anon/live1" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.35rem;border-radius:4px;font-size:0.82rem"/></div>
            <div><div style="font-size:0.72rem;color:var(--muted);margin-bottom:3px">Bitrate kbps</div>
              <input id="inj-br" type="number" value="4000" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.35rem;border-radius:4px;font-size:0.82rem"/></div>
          </div>
          <div style="display:flex;gap:0.5rem">
            <button class="btn" style="flex:1;border-color:var(--green);color:var(--green)" onclick="injectFromForm()">▶ Inyectar</button>
            <button class="btn danger" onclick="stopInject(document.getElementById('inj-id')?.value||'anon/live1')">⏹</button>
          </div>
          <div id="inj-status" style="margin-top:0.4rem;font-size:0.78rem;color:var(--muted)"></div>
        </div>
        <div class="section-title" style="margin-bottom:0.6rem">Stats</div>
        <div class="card">
          <div class="stat-item"><span class="stat-label">Broadcasts activos</span><span class="stat-value">${data.filter(b=>b.status==='active').length}</span></div>
          <div class="stat-item"><span class="stat-label">Bitrate total</span><span class="stat-value">${(data.reduce((s,b)=>s+b.bitrate_kbps,0)/1000).toFixed(1)} Mbps</span></div>
          <div class="stat-item"><span class="stat-label">Viewers</span><span class="stat-value">${data.reduce((s,b)=>s+b.viewers,0)}</span></div>
          <div class="stat-item"><span class="stat-label">Clock MoQ</span><span class="stat-value" style="color:${source.has_clock?'var(--green)':'var(--muted)'}">${source.has_clock?'✓ presente':'—'}</span></div>
        </div>
      </div>
    </div>
    <div class="section-title">Lista de broadcasts</div>
    <table><thead><tr><th>Broadcast</th><th>Estado</th><th>Bitrate</th><th>Viewers</th><th>Encoder</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody></table>`);
}

async function killBroadcast(id) {
  if (!confirm(`¿Matar broadcast ${id}?`)) return;
  await api('/admin/broadcasts/kill', {method:'POST', body: JSON.stringify({broadcast_id: id})});
  loadBroadcasts();
}
async function injectBroadcast(id, bitrate) {
  const st = document.getElementById('inj-status');
  if (st) st.textContent = 'Inyectando...';
  const r = await api('/admin/broadcasts/inject', {method:'POST', body: JSON.stringify({broadcast_id: id, bitrate_kbps: bitrate})});
  const d = await r.json();
  if (st) st.textContent = d.note || 'OK';
  setTimeout(() => loadBroadcasts(), 800);
}
async function injectFromForm() {
  const id = document.getElementById('inj-id')?.value || 'anon/live1';
  const br = parseInt(document.getElementById('inj-br')?.value || '4000');
  await injectBroadcast(id, br);
}
async function stopInject(id) {
  await api('/admin/broadcasts/stop-inject', {method:'POST', body: JSON.stringify({broadcast_id: id})});
  loadBroadcasts();
}

// ── Federación ────────────────────────────────────────────────────────────────
async function loadFederation() {
  const r = await api('/admin/federation/nodes');
  const {active, pending} = await r.json();
  const pRows = pending.map(n => `<tr><td>${n.id||'—'}</td><td>${n.region||'—'}</td>
    <td><button class="btn" onclick="approveNode('${n.id}')">Aprobar</button>
    <button class="btn danger" onclick="revokeNode('${n.id}')">Revocar</button></td></tr>`).join('');
  setContent(`
    <div class="grid-3">
      <div class="card"><div class="label">Nodos activos</div><div class="value green">${active.length}</div></div>
      <div class="card"><div class="label">Pendientes</div><div class="value yellow">${pending.length}</div></div>
    </div>
    <div class="section-title">Simular nodo externo</div>
    <div class="card" style="max-width:480px;margin-bottom:1rem;display:flex;gap:0.75rem;align-items:flex-end">
      <div style="flex:1"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Node ID</div>
        <input id="fed-id" placeholder="sim-relay-xxx" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem"/></div>
      <div style="flex:1"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Región</div>
        <input id="fed-region" value="eu-west-1" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem"/></div>
      <button class="btn" onclick="simulateNode()">+ Simular nodo</button>
    </div>
    <div class="section-title">Nodos pendientes de aprobación</div>
    ${pending.length ? `<table><thead><tr><th>Node ID</th><th>Región</th><th>Sim</th><th>Acción</th></tr></thead><tbody>${
      pending.map(n=>`<tr><td>${n.id||'—'}</td><td>${n.region||'—'}</td><td>${n.simulated?'<span class="badge yellow">sim</span>':'—'}</td>
      <td><button class="btn" onclick="approveNode('${n.id}')">Aprobar</button>
      <button class="btn danger" onclick="revokeNode('${n.id}')">Revocar</button></td></tr>`).join('')
    }</tbody></table>`
      : '<p style="color:var(--muted);font-size:0.85rem">No hay nodos pendientes</p>'}`);
}

async function approveNode(id) {
  await api(`/admin/federation/nodes/${id}/approve`, {method:'POST'});
  loadFederation();
}
async function revokeNode(id) {
  await api(`/admin/federation/nodes/${id}/revoke`, {method:'POST'});
  loadFederation();
}
async function simulateNode() {
  const id     = document.getElementById('fed-id')?.value.trim() || '';
  const region = document.getElementById('fed-region')?.value.trim() || 'eu-west-1';
  const body   = id ? {node_id: id, region} : {region};
  const r = await api('/admin/federation/simulate-node', {method:'POST', body: JSON.stringify(body)});
  const d = await r.json();
  loadFederation();
}

// ── DRM / Rights ──────────────────────────────────────────────────────────────
async function loadDRM() {
  const [subsR, simR] = await Promise.all([
    api('/admin/drm/subscriptions'),
    api('/admin/drm/subscriptions/sim-list'),
  ]);
  const subs = await subsR.json();
  const simSubs = await simR.json();
  const allSubs = [...subs, ...simSubs.filter(s => !subs.find(x=>x.subscription_id===s.subscription_id))];
  const rows = allSubs.map(s => {
    const pct = s.max_plays ? Math.min(100, Math.round((s.plays_used/s.max_plays)*100)) : 0;
    const bar = s.max_plays ? `<div style="width:80px;height:6px;background:var(--border);border-radius:3px;display:inline-block;margin-left:6px"><div style="width:${pct}%;height:100%;background:${pct>=100?'var(--red)':pct>60?'var(--yellow)':'var(--green)'};border-radius:3px"></div></div>` : '';
    return `<tr>
      <td><code>${s.subscription_id}</code>${s.max_plays?'':''}</td>
      <td>${s.plays_used}${s.max_plays?`/${s.max_plays}`:''}${bar}</td>
      <td style="display:flex;gap:4px">
        ${s.max_plays?`<button class="btn" onclick="consumePlay('${s.subscription_id}')">+1 Play</button>`:''}
        <button class="btn" onclick="resetSub('${s.subscription_id}')">Reset</button>
        <button class="btn danger" onclick="revokeSub('${s.subscription_id}')">Revocar</button>
      </td></tr>`;
  }).join('');
  setContent(`
    <div class="grid-3">
      <div class="card"><div class="label">Subs Redis</div><div class="value">${subs.length}</div></div>
      <div class="card"><div class="label">Subs simuladas</div><div class="value yellow">${simSubs.length}</div></div>
    </div>
    <div class="section-title">Simulador DRM</div>
    <div class="card" style="max-width:480px;margin-bottom:1rem;display:flex;gap:0.75rem;align-items:flex-end">
      <div style="flex:1"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Subscription ID</div>
        <input id="drm-id" placeholder="sub_auto" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem"/></div>
      <div style="width:80px"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Max plays</div>
        <input id="drm-max" type="number" value="5" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem"/></div>
      <button class="btn" onclick="createSimSub()">+ Crear</button>
    </div>
    <div class="section-title">Suscripciones activas</div>
    ${allSubs.length ? `<table><thead><tr><th>Subscription ID</th><th>Plays</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<p style="color:var(--muted);font-size:0.85rem">Sin datos — crea una suscripción de prueba</p>'}`);
}

async function resetSub(id) {
  await api(`/admin/drm/subscriptions/${id}/reset`, {method:'POST'});
  loadDRM();
}
async function revokeSub(id) {
  if (!confirm(`¿Revocar acceso de ${id}?`)) return;
  await api(`/admin/drm/subscriptions/${id}/revoke`, {method:'POST'});
  loadDRM();
}
async function createSimSub() {
  const id  = document.getElementById('drm-id')?.value.trim() || '';
  const max = parseInt(document.getElementById('drm-max')?.value || '5');
  const body = id ? {subscription_id: id, max_plays: max} : {max_plays: max};
  await api('/admin/drm/subscriptions/simulate', {method:'POST', body: JSON.stringify(body)});
  loadDRM();
}
async function consumePlay(id) {
  const r = await api('/admin/drm/subscriptions/consume', {method:'POST', body: JSON.stringify({subscription_id: id})});
  const d = await r.json();
  if (!d.allowed) alert(`❌ max_plays (${d.max_plays}) superado para ${id}`);
  loadDRM();
}

// ── Monetización ──────────────────────────────────────────────────────────────
async function loadMonetization() {
  const [statsR, eventsR] = await Promise.all([
    api('/admin/monetization/stats'),
    api('/admin/monetization/events'),
  ]);
  const stats = await statsR.json();
  const events = await eventsR.json();
  const eRows = events.map(e => `<tr><td><code>${e.id}</code></td><td>${e.type}</td>
    <td>${e.data?.object?.amount_paid ? (e.data.object.amount_paid/100).toFixed(2)+' '+e.data.object.currency.toUpperCase() : '—'}</td>
    <td>${new Date(e.created*1000).toLocaleString()}</td></tr>`).join('');
  setContent(`
    <div class="grid-3">
      <div class="card"><div class="label">MRR</div><div class="value green">${(stats.mrr_eur/100).toFixed(2)} €</div></div>
      <div class="card"><div class="label">Suscripciones activas</div><div class="value">${stats.active_subscriptions}</div></div>
      <div class="card"><div class="label">Churn</div><div class="value yellow">${stats.churn_rate_pct||0}%</div></div>
      <div class="card"><div class="label">Dunning</div><div class="value ${stats.dunning_count>0?'red':''}">${stats.dunning_count||0}</div></div>
    </div>
    <div class="section-title">Últimos eventos Stripe ${stats.source==='mock'?'(mock)':''}</div>
    <table><thead><tr><th>ID</th><th>Tipo</th><th>Importe</th><th>Fecha</th></tr></thead><tbody>${eRows}</tbody></table>`);
}

// ── QoS ───────────────────────────────────────────────────────────────────────
async function loadQoS() {
  const [alertsR, latencyR] = await Promise.all([
    api('/admin/qos/alerts'),
    api('/admin/qos/latency'),
  ]);
  const alertData = await alertsR.json();
  const {alerts} = alertData;
  const latency = await latencyR.json();
  const alertsHtml = alerts.length
    ? alerts.map(a => {
        const sim = a.labels?.source === 'simulated';
        return `<div class="alert-item" style="${sim?'border-color:rgba(255,193,7,0.4);background:rgba(255,193,7,0.08)':''}">
          <span class="aname">${a.labels?.alertname||'?'}</span>
          ${sim ? '<span class="badge yellow" style="margin-left:6px">simulada</span>' : ''}
          — ${a.annotations?.description||a.annotations?.summary||''}
          ${sim ? `<button class="btn" style="float:right;font-size:0.72rem;padding:2px 8px" onclick="resolveAlert('${a.id}')">Resolver</button>` : ''}
        </div>`;
      }).join('')
    : '<p style="color:var(--green);font-size:0.85rem">✓ Sin alertas activas</p>';
  const latRows = latency.map(r => `<tr><td><code>${r.namespace}</code></td>
    <td class="${r.p95>700?'red':''}">${r.p95||0} ms</td><td>${r.samples}</td></tr>`).join('');
  const grafana = window.GRAFANA_URL || 'http://localhost:3000';
  // Comprobar si Grafana está disponible
  let grafanaAvailable = false;
  try {
    const gr = await fetch(`${grafana}/api/health`, {signal: AbortSignal.timeout(2000)});
    grafanaAvailable = gr.ok;
  } catch(e) { grafanaAvailable = false; }

  const grafanaHtml = grafanaAvailable
    ? `<iframe class="grafana" src="${grafana}/d/teremoqwow?orgId=1&kiosk=tv" title="Grafana"></iframe>`
    : `<div style="background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:2rem;text-align:center;color:var(--muted)">
        <div style="font-size:1.5rem;margin-bottom:0.5rem">📊</div>
        <div style="margin-bottom:0.5rem">Grafana no está disponible en modo dev sin Docker</div>
        <div style="font-size:0.8rem">Para ver el dashboard completo: <code style="background:var(--bg);padding:2px 6px;border-radius:4px">docker compose up grafana prometheus</code></div>
        <div style="margin-top:1rem"><a href="${grafana}" target="_blank" style="color:var(--accent)">${grafana}</a></div>
       </div>`;

  const alertNames = ['LipSyncDrift','BufferBelowThreshold','HighE2ELatency','VideoContinuityError'];
  setContent(`
    <div class="section-title">Alertas Prometheus activas ${alertData.simulated?`<span style="color:var(--muted);font-size:0.75rem">(${alertData.simulated} simuladas)</span>`:''}</div>
    ${alertsHtml}
    <div class="section-title" style="margin-top:1.25rem">Consola de pruebas — disparar alerta</div>
    <div class="card" style="max-width:480px;margin-bottom:1rem;display:flex;gap:0.75rem;align-items:flex-end">
      <div style="flex:1"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Tipo de alerta</div>
        <select id="alert-type" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem">
          ${alertNames.map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select></div>
      <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="fireAlert()">🔥 Disparar</button>
    </div>
    <div class="section-title" style="margin-top:1.25rem">Latencia P95 por broadcast (últimos 15 min)</div>
    <table><thead><tr><th>Namespace</th><th>P95</th><th>Muestras</th></tr></thead><tbody>${latRows}</tbody></table>
    <div class="section-title" style="margin-top:1.25rem">Dashboard Grafana</div>
    ${grafanaHtml}`);
}

async function fireAlert() {
  const name = document.getElementById('alert-type')?.value;
  await api('/admin/qos/alerts/test', {method:'POST', body: JSON.stringify({alert_name: name})});
  loadQoS();
}
async function resolveAlert(id) {
  await api('/admin/qos/alerts/resolve', {method:'POST', body: JSON.stringify({id})});
  loadQoS();
}

// ── Seguridad ─────────────────────────────────────────────────────────────────
async function loadSecurity() {
  const r = await api('/admin/security/rate-limit-hits');
  const hits = await r.json();
  const rows = hits.map(h => `<tr><td><code>${h.ip}</code></td><td>${h.requests}</td><td>${h.ttl_s}s</td></tr>`).join('');
  setContent(`
    <div class="section-title">Rate-limit hits recientes (Redis rl:*)</div>
    ${hits.length ? `<table><thead><tr><th>IP</th><th>Requests</th><th>TTL</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<p style="color:var(--muted);font-size:0.85rem">Sin hits (Redis vacío o no conectado)</p>'}
    <div class="section-title" style="margin-top:1.5rem">Rotar secretos</div>
    <div style="display:flex;gap:1rem;margin-top:0.5rem">
      <button class="btn" onclick="rotateSecret('webhook')">Rotar WEBHOOK_SECRET</button>
      <button class="btn" onclick="rotateSecret('jwt')">Rotar JWT key</button>
    </div>`);
}

async function rotateSecret(type) {
  const r = await api('/admin/security/rotate-secret', {method:'POST', body: JSON.stringify({type})});
  const data = await r.json();
  alert(`Nuevo secreto (preview): ${data.new_secret_preview}\n\nAcción: ${data.action}\nVariable: ${data.env_var}`);
}

// ── Feature Flags ─────────────────────────────────────────────────────────────
async function loadFlags() {
  const r = await api('/admin/flags');
  const flags = await r.json();
  const rows = Object.entries(flags).map(([k, v]) => `
    <div class="flag-row">
      <span>${k.replace(/_/g,' ')}</span>
      <label class="toggle">
        <input type="checkbox" ${v?'checked':''} onchange="setFlag('${k}',this.checked)" />
        <span class="slider"></span>
      </label>
    </div>`).join('');
  setContent(`<div class="section-title">Feature Flags globales</div><div class="card" style="max-width:500px">${rows}</div>`);
}

async function setFlag(flag, enabled) {
  await api(`/admin/flags/${flag}`, {method:'PATCH', body: JSON.stringify({enabled})});
}

// ── Auditoría ─────────────────────────────────────────────────────────────────
async function loadAudit() {
  const r = await api('/admin/audit?limit=50');
  const log = await r.json();
  const rows = log.map(e => `<tr><td>${e.ts}</td><td>${e.actor}</td>
    <td><span class="badge blue">${e.role}</span></td>
    <td><code>${e.action}</code></td><td>${e.detail||'—'}</td><td>${e.ip}</td></tr>`).join('');
  setContent(`
    <div class="section-title">Log de auditoría (últimas 50 acciones)</div>
    ${log.length ? `<table><thead><tr><th>Timestamp</th><th>Actor</th><th>Rol</th><th>Acción</th><th>Detalle</th><th>IP</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<p style="color:var(--muted);font-size:0.85rem">Sin acciones registradas todavía</p>'}`);
}

// ── Monitor ───────────────────────────────────────────────────────────────────
let _monitorInterval = null;

async function loadMonitor() {
  const relayUrl = window.MOQ_RELAY_URL || 'https://127.0.0.1:4443/anon';
  setContent(`
    <div style="display:grid;grid-template-columns:1fr 340px;gap:1.25rem">
      <div>
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem">
          <div class="section-title" style="margin:0">Consumer — stream en vivo</div>
          <select id="mon-broadcast" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.3rem 0.5rem;border-radius:4px;font-size:0.82rem">
            <option value="anon/live1">anon/live1</option>
          </select>
          <button class="btn" onclick="refreshMonitor()">⟳ Reconectar</button>
        </div>
        <div style="background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;position:relative;border:1px solid var(--border)">
          <iframe id="mon-player"
            src="${window.PLAYER_URL || 'http://localhost:5173'}"
            style="width:100%;height:100%;border:none"
            allow="autoplay; camera; microphone"
            sandbox="allow-scripts allow-same-origin allow-forms">
          </iframe>
          <div id="mon-overlay" style="position:absolute;inset:0;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff">
            <div style="font-size:2rem;margin-bottom:0.5rem">📡</div>
            <div id="mon-status-text" style="font-size:0.9rem;color:var(--muted)">Verificando origen...</div>
          </div>
        </div>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:0.75rem">Estado del origen</div>
        <div class="card" id="mon-source-card">
          <div class="loading" style="padding:1rem 0">Consultando relay...</div>
        </div>
        <div class="section-title" style="margin:1rem 0 0.75rem">Relay</div>
        <div class="card">
          <div class="flag-row" style="border:none;padding:0.4rem 0">
            <span style="font-size:0.82rem;color:var(--muted)">MoQ Relay</span>
            <a href="http://localhost:8090" target="_blank" style="color:var(--accent);font-size:0.82rem">localhost:8090 ↗</a>
          </div>
          <div class="flag-row" style="border:none;padding:0.4rem 0">
            <span style="font-size:0.82rem;color:var(--muted)">Player</span>
            <a href="http://localhost:5173" target="_blank" style="color:var(--accent);font-size:0.82rem">localhost:5173 ↗</a>
          </div>
        </div>
      </div>
    </div>`);
  startMonitorPolling();
}

async function startMonitorPolling() {
  if (_monitorInterval) clearInterval(_monitorInterval);
  await pollMonitorSource();
  _monitorInterval = setInterval(pollMonitorSource, 3000);
}

async function pollMonitorSource() {
  const broadcast = document.getElementById('mon-broadcast')?.value || 'anon/live1';
  try {
    const r = await api(`/admin/monitor/source?broadcast=${encodeURIComponent(broadcast)}`);
    const d = await r.json();
    const card = document.getElementById('mon-source-card');
    const overlay = document.getElementById('mon-overlay');
    const statusTxt = document.getElementById('mon-status-text');
    if (!card) return;

    if (d.broadcasting) {
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.5s infinite"></span>
          <span style="color:var(--green);font-weight:600">TRANSMITIENDO</span>
        </div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem">Broadcast: <code>${d.broadcast}</code></div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.25rem">Tracks activos:</div>
        ${d.tracks.map(t=>`<div style="font-size:0.78rem;padding:2px 0;color:var(--text)">· <code>${t}</code></div>`).join('')}
        <div style="margin-top:0.5rem;font-size:0.75rem;color:var(--muted)">Clock: ${d.has_clock?'✓ presente':'—'} · Fuente: ${d.source}</div>`;
      if (overlay) overlay.style.display = 'none';
    } else {
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block"></span>
          <span style="color:var(--red);font-weight:600">SIN SEÑAL</span>
        </div>
        <div style="font-size:0.82rem;color:var(--muted)">No hay broadcast activo en <code>${d.broadcast}</code></div>
        <div style="margin-top:0.75rem">
          <button class="btn" style="font-size:0.8rem" onclick="injectBroadcast('${d.broadcast}', 4000)">▶ Inyectar stream de prueba</button>
        </div>`;
      if (overlay) { overlay.style.display = 'flex'; if(statusTxt) statusTxt.textContent = 'Sin señal — inyecta un stream primero'; }
    }
  } catch(e) {
    const card = document.getElementById('mon-source-card');
    if (card) card.innerHTML = '<div style="color:var(--red);font-size:0.82rem">Error consultando el relay</div>';
  }
}

function refreshMonitor() {
  const iframe = document.getElementById('mon-player');
  if (iframe) iframe.src = iframe.src;
  pollMonitorSource();
}

// Limpiar interval al cambiar de página
const _origNavigate = navigate;
function navigate(el) {
  if (_monitorInterval) { clearInterval(_monitorInterval); _monitorInterval = null; }
  _origNavigate(el);
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (token) {
  try {
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (payload.exp > Date.now()/1000) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('user-email').textContent = payload.email;
      document.getElementById('sidebar-user').textContent = `${payload.role} · ${payload.email}`;
      loadPage(currentPage);
    } else { token = ''; localStorage.removeItem('admin_token'); }
  } catch(e) { token = ''; localStorage.removeItem('admin_token'); }
}
</script>
