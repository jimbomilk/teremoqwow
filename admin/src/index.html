<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>teremoqwow Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --border: #2a2a3a;
      --text: #e0e0f0; --muted: #888; --accent: #4fc3f7;
      --green: #4caf50; --red: #ef5350; --yellow: #ffc107;
      --sidebar-w: 220px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
               display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar header { padding: 1.25rem 1rem; border-bottom: 1px solid var(--border); }
    #sidebar header h1 { font-size: 1rem; color: var(--accent); }
    #sidebar header p  { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    #sidebar nav { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
    .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1rem;
                font-size: 0.85rem; cursor: pointer; border-left: 3px solid transparent;
                transition: background 0.15s; }
    .nav-item:hover { background: rgba(79,195,247,0.08); }
    .nav-item.active { border-left-color: var(--accent); background: rgba(79,195,247,0.12); color: var(--accent); }
    #sidebar footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
              display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; flex-shrink: 0; }
    #topbar .title { font-size: 1rem; font-weight: 600; }
    #topbar .user  { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.75rem; }
    #topbar .logout-btn { background: none; border: 1px solid var(--border); color: var(--text);
                          padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    #topbar .logout-btn:hover { border-color: var(--red); color: var(--red); }
    #content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    /* Login */
    #login-screen { position: fixed; inset: 0; background: var(--bg);
                    display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                 padding: 2rem; width: 360px; }
    .login-box h2 { margin-bottom: 1.5rem; color: var(--accent); }
    .form-field { margin-bottom: 1rem; }
    .form-field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-field input { width: 100%; background: var(--bg); border: 1px solid var(--border);
                        color: var(--text); padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.9rem; }
    .form-field input:focus { outline: none; border-color: var(--accent); }
    .btn-primary { width: 100%; background: var(--accent); color: #000; font-weight: 600;
                   border: none; padding: 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .btn-primary:hover { opacity: 0.9; }
    .error-msg { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; }
    /* Cards / grid */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .card .value { font-size: 1.5rem; font-weight: 700; }
    .card .value.green { color: var(--green); }
    .card .value.red   { color: var(--red); }
    .card .value.yellow { color: var(--yellow); }
    /* Table */
    .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; }
    .badge.green  { background: rgba(76,175,80,0.2); color: var(--green); }
    .badge.red    { background: rgba(239,83,80,0.2); color: var(--red); }
    .badge.yellow { background: rgba(255,193,7,0.2); color: var(--yellow); }
    .badge.blue   { background: rgba(79,195,247,0.2); color: var(--accent); }
    /* Buttons */
    .btn { padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
           border: 1px solid var(--border); background: none; color: var(--text); }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: rgba(239,83,80,0.1); }
    .flag-row { display: flex; align-items: center; justify-content: space-between;
                padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .slider::before { content:""; position:absolute; height:14px; width:14px; left:3px; bottom:3px;
                      background:#fff; border-radius:50%; transition:0.2s; }
    input:checked + .slider { background: var(--green); }
    input:checked + .slider::before { transform: translateX(16px); }
    .loading { color: var(--muted); font-size: 0.85rem; padding: 2rem 0; text-align: center; }
    .alert-item { background: rgba(239,83,80,0.1); border: 1px solid rgba(239,83,80,0.3);
                  border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .alert-item .aname { font-weight: 600; color: var(--red); }
    iframe.grafana { width: 100%; height: 600px; border: none; border-radius: 8px;
                     background: var(--surface); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>⚡ teremoqwow Admin</h2>
    <div class="form-field">
      <label>Email</label>
      <input id="login-email" type="email" value="admin@teremoqwow.dev" />
    </div>
    <div class="form-field">
      <label>Password</label>
      <input id="login-password" type="password" value="dev-secret" />
    </div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <header>
    <h1>⚡ teremoqwow</h1>
    <p>Admin panel</p>
  </header>
  <nav id="nav">
    <div class="nav-item active" data-page="broadcasts" onclick="navigate(this)">📡 Broadcasts</div>
    <div class="nav-item" data-page="federation" onclick="navigate(this)">🌐 Federación</div>
    <div class="nav-item" data-page="drm" onclick="navigate(this)">🔒 DRM / Rights</div>
    <div class="nav-item" data-page="monetization" onclick="navigate(this)">💳 Monetización</div>
    <div class="nav-item" data-page="qos" onclick="navigate(this)">📊 QoS</div>
    <div class="nav-item" data-page="security" onclick="navigate(this)">🛡️ Seguridad</div>
    <div class="nav-item" data-page="flags" onclick="navigate(this)">🚩 Feature Flags</div>
    <div class="nav-item" data-page="audit" onclick="navigate(this)">📋 Auditoría</div>
    <div class="nav-item" data-page="overlays" onclick="navigate(this)">🎨 Overlays</div>
  </nav>
  <footer id="sidebar-user">—</footer>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <span class="title" id="page-title">Broadcasts</span>
    <div id="global-status" style="display:flex;align-items:center;gap:0.75rem;font-size:0.75rem">
      <span id="gs-relay">relay ●</span>
      <span id="gs-krakend">krakend ●</span>
      <span id="gs-streams">— señales</span>
      <span id="gs-viewers">— viewers</span>
      <span id="gs-alerts" style="cursor:pointer" onclick="navigate(document.querySelector('[data-page=broadcasts]'))">0 alertas</span>
    </div>
    <span class="user">
      <span id="user-email"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </span>
  </div>
  <div id="content"><div class="loading">Cargando...</div></div>
</div>

<script>
const API = window.ADMIN_API_URL || '/admin-api';
let token = localStorage.getItem('admin_token') || '';
let currentPage = 'broadcasts';

// Detectar host desde la URL actual (localhost, IP local, o hostname Tailscale)
// para que el iframe cargue desde la misma máquina que sirve el admin
const _host = window.location.hostname || 'localhost';
window.MOQ_RELAY_URL = `https://${_host}:4443/anon`;
window.PLAYER_URL    = `https://${_host}:5443`;
window.AUTH_URL      = window.AUTH_URL || '';
(async () => {
  try {
    const r = await fetch(`${API}/admin/relay/cert-hash`);
    if (r.ok) {
      const d = await r.json();
      if (d.cert_hash) window.MOQ_CERT_HASH = d.cert_hash;
    }
  } catch (_) {}
})();

const pages = {
  broadcasts:   { title: 'Broadcasts',   load: loadBroadcasts },
  federation:   { title: 'Federación',   load: loadFederation },
  drm:          { title: 'DRM / Rights', load: loadDRM },
  monetization: { title: 'Monetización', load: loadMonetization },
  qos:          { title: 'QoS',          load: loadQoS },
  security:     { title: 'Seguridad',    load: loadSecurity },
  flags:        { title: 'Feature Flags',load: loadFlags },
  audit:        { title: 'Auditoría',    load: loadAudit },
  overlays:     { title: 'Overlays',      load: loadOverlays },
};

async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  if (r.status === 401) { logout(); throw new Error('401'); }
  return r;
}

async function login() {
  const email = document.getElementById('login-email').value;
  const pass  = document.getElementById('login-password').value;
  const authUrl = window.AUTH_URL || '';
  try {
    const r = await fetch(`${authUrl}/auth/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass}),
    });
    if (!r.ok) { document.getElementById('login-error').textContent = 'Credenciales inválidas'; return; }
    const data = await r.json();
    // Verificar rol admin
    const payload = JSON.parse(atob(data.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (!['admin','superadmin','operator','analyst'].includes(payload.role)) {
      document.getElementById('login-error').textContent = 'Acceso denegado: rol insuficiente';
      return;
    }
    token = data.access_token;
    localStorage.setItem('admin_token', token);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('user-email').textContent = payload.email;
    document.getElementById('sidebar-user').textContent = `${payload.role} · ${payload.email}`;
    loadPage(currentPage);
    _startGlobalStatusPoll();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Error de conexión con Auth API';
  }
}

function logout() {
  token = ''; localStorage.removeItem('admin_token');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').textContent = '';
}

function navigate(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const page = el.dataset.page;
  currentPage = page;
  document.getElementById('page-title').textContent = pages[page].title;
  loadPage(page);
}

function loadPage(page) {
  document.getElementById('content').innerHTML = '<div class="loading">Cargando...</div>';
  pages[page].load();
}

function setContent(html) { document.getElementById('content').innerHTML = html; }

// ── Broadcasts ───────────────────────────────────────────────────────────────
// ── Helpers de señal ──────────────────────────────────────────────────────────

function _signalTileId(broadcastId) { return 'tile-' + broadcastId.replace(/\W/g,'_'); }

function _renderSignalTile(b, audioInfo, ls, playerUrl) {
  const tid  = _signalTileId(b.id);
  const cert = window.MOQ_CERT_HASH ? `&cert=${encodeURIComponent(window.MOQ_CERT_HASH)}` : '';
  const relayParam = window.MOQ_RELAY_URL ? `&relay=${encodeURIComponent(window.MOQ_RELAY_URL)}` : '';
  const viewUrl = `${playerUrl}?embed=1&broadcast=${encodeURIComponent(b.id)}${relayParam}${cert}`;
  const lsMs = ls?.lipsync_ms ?? 0;
  const lsOk = Math.abs(lsMs) < 40;
  const lsColor = lsOk ? 'var(--green)' : Math.abs(lsMs) < 80 ? 'var(--yellow)' : 'var(--red)';
  const tracks = (audioInfo?.tracks || b.audio_tracks || [{id:'t0',lang:'es',label:'Español'}]);
  const trackBadges = tracks.map(t =>
    `<span data-tid="${t.id}" data-bid="${b.id}"
      style="background:rgba(79,195,247,0.12);border:1px solid rgba(79,195,247,0.25);
             border-radius:3px;padding:1px 5px;font-size:0.65rem;color:var(--accent);cursor:pointer"
      title="Click para eliminar" onclick="removeAudioTrack('${b.id}','${t.id}')">${t.label}</span>`
  ).join('');

  const videoKbps = (b.video_kbps || Math.round(b.bitrate_kbps * 0.94));
  const audioKbps = audioInfo?.kbps || b.audio_kbps || (b.bitrate_kbps - videoKbps);

  return `
  <div id="${tid}" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column">
    <!-- ── Header ── -->
    <div style="padding:0.45rem 0.8rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.5rem;flex-shrink:0;background:rgba(0,0,0,0.25)">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.5s infinite;flex-shrink:0"></span>
      <code style="font-size:0.82rem;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.id}</code>
      ${b.simulated ? '<span class="badge yellow">sim</span>' : ''}
      <span class="badge green" style="font-size:0.65rem">${b.status}</span>
      <a href="${viewUrl}" target="_blank"
        style="background:rgba(79,195,247,0.14);border:1px solid rgba(79,195,247,0.3);color:var(--accent);
               padding:2px 10px;border-radius:4px;font-size:0.72rem;text-decoration:none;white-space:nowrap">▶ Ver</a>
      <button onclick="stopInject('${b.id}')"
        style="background:rgba(239,83,80,0.12);border:1px solid rgba(239,83,80,0.3);color:var(--red);
               padding:2px 8px;border-radius:4px;cursor:pointer;font-size:0.72rem">⏹ Parar</button>
      <button class="btn danger" style="font-size:0.7rem;padding:2px 8px;margin-left:8px;border-color:var(--red)" onclick="killBroadcast('${b.id}')">💀 Forzar</button>
      <button onclick="navigator.clipboard.writeText('${viewUrl}').then(e=>this.textContent='✓').catch(()=>{})"
        style="background:none;border:1px solid var(--border);color:var(--muted);padding:2px 7px;border-radius:4px;cursor:pointer;font-size:0.7rem" title="Copiar URL">📋</button>
    </div>
    <!-- ── Body 3 paneles ── -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;min-height:200px;flex:1">

      <!-- 📹 VIDEO — preview del origen (fuente antes de MoQ) -->
      <div style="border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0">
        <div style="padding:0.3rem 0.6rem;font-size:0.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,0.05)">
          📹 Vídeo <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">· origen</span>
        </div>
        <iframe id="cv-vid-${tid}"
          src="${viewUrl}"
          loading="lazy"
          style="flex:1;width:100%;height:220px;min-height:220px;display:block;background:#000;border:none"
          title="Preview stream ${b.id}">
        </iframe>
        <div style="padding:0.35rem 0.6rem;font-size:0.7rem;line-height:1.6;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="color:var(--text);font-weight:500">${b.video_resolution||'1280×720'} · ${b.video_fps||30} fps</div>
          <div style="color:var(--muted)">${b.video_codec||'H.264'} ${b.video_profile||'Main'}</div>
          <div style="color:var(--accent)">${(videoKbps/1000).toFixed(1)} Mbps vídeo</div>
          <div style="margin-top:3px">
            <a href="${viewUrl}" target="_blank" style="font-size:0.65rem;color:var(--accent);text-decoration:none">
              ↗ ver stream MoQ en el player
            </a>
          </div>
        </div>
      </div>

      <!-- 🔊 AUDIO -->
      <div style="border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0">
        <div style="padding:0.3rem 0.6rem;font-size:0.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,0.05)">🔊 Audio</div>
        <canvas id="cv-aud-${tid}" style="flex:1;width:100%;display:block;min-height:120px"></canvas>
        <div style="padding:0.35rem 0.6rem;font-size:0.7rem;line-height:1.6;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="color:var(--text);font-weight:500">${audioInfo?.codec||b.audio_codec||'AAC'} · ${audioKbps} kbps</div>
          <div style="color:var(--muted)">${audioInfo?.channels||b.audio_channels||2}ch · ${((audioInfo?.sample_rate||b.audio_sample_rate||48000)/1000).toFixed(0)} kHz</div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;align-items:center">
            ${trackBadges}
            <button onclick="addAudioTrackUI('${b.id}')"
              style="background:none;border:1px dashed rgba(255,255,255,0.2);color:var(--muted);padding:1px 5px;border-radius:3px;cursor:pointer;font-size:0.62rem;line-height:1.3">+</button>
          </div>
        </div>
      </div>

      <!-- 📊 DATA -->
      <div style="display:flex;flex-direction:column;min-width:0">
        <div style="padding:0.3rem 0.6rem;font-size:0.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,0.05)">📊 Data</div>
        <div style="padding:0.5rem 0.7rem;flex:1;font-size:0.72rem;line-height:1.85">
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Total bitrate</span><span style="color:var(--text)">${(b.bitrate_kbps/1000).toFixed(1)} Mbps</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Viewers</span><span id="viewers-${tid}" style="color:var(--text)">${b.viewers}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Relay</span><span id="relay-status-${tid}" style="color:var(--muted);font-size:0.65rem">—</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Lip-sync</span><span style="color:${lsColor}">${lsMs >= 0 ? '+' : ''}${lsMs} ms ${lsOk ? '✓' : '⚠'}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Latencia</span><span style="color:var(--green)">&lt;100 ms</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Encoder</span><span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px" title="${b.encoder||'—'}">${b.encoder||'—'}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Iniciado</span><span style="color:var(--muted);font-size:0.65rem">${b.started_at?.slice(11,19)||'—'}</span></div>
        </div>
        <!-- Alerta audio simulada -->
        <div style="padding:0.35rem 0.6rem;border-top:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:0.62rem;color:var(--muted);margin-bottom:3px">Simular alerta audio</div>
          <div style="display:flex;gap:3px">
            <button onclick="simAudioAlert('${b.id}','silence')" class="btn" style="flex:1;font-size:0.62rem;padding:2px">Silencio</button>
            <button onclick="simAudioAlert('${b.id}','clipping')" class="btn" style="flex:1;font-size:0.62rem;padding:2px">Clip</button>
            <button onclick="simAudioAlert('${b.id}','desync')" class="btn" style="flex:1;font-size:0.62rem;padding:2px">Desync</button>
          </div>
        </div>
      </div>

    </div>
  </div>`;
}

async function loadBroadcasts() {
  const [r, srcR, audioR, lsR, alertsR] = await Promise.all([
    api('/admin/broadcasts'),
    api('/admin/monitor/source?broadcast=anon/live1'),
    api('/admin/audio/tracks'),
    api('/admin/audio/lipsync'),
    api('/admin/audio/alerts'),
  ]);
  const data      = await r.json();
  const source    = await srcR.json();
  const audioList = await audioR.json();
  const lsList    = await lsR.json();
  const auAlerts  = await alertsR.json();

  // Indexar por broadcast_id
  const audioMap = Object.fromEntries(audioList.map(a => [a.broadcast_id, a]));
  const lsMap    = Object.fromEntries(lsList.map(l => [l.broadcast_id, l]));

  const playerUrl = window.PLAYER_URL || 'http://localhost:5173';
  const active = data.filter(b => b.status === 'active');
  const cols   = active.length <= 1 ? 1 : active.length <= 2 ? 2 : 2;

  const tiles = active.length
    ? active.map(b => _renderSignalTile(b, audioMap[b.id], lsMap[b.id], playerUrl)).join('')

// ── Poll al relay para conexiones en tiempo real ───────────────────────────────

let _relayPollTimer = null;
function _startRelayPoll(broadcasts) {
  if (_relayPollTimer) clearInterval(_relayPollTimer);
  async function poll() {
    try {
      const r = await fetch(`${API}/admin/relay/connections`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!r.ok) return;
      const d = await r.json();
      broadcasts.forEach(b => {
        const tid = _signalTileId(b.id);
        const viewersEl = document.getElementById('viewers-' + tid);
        const statusEl  = document.getElementById('relay-status-' + tid);
        if (!viewersEl || !statusEl) return;
        const isLive = d.online && d.broadcasts.some(s => s.includes(b.id.split('/')[0]));
        const viewers = b.viewers;
        viewersEl.textContent = String(viewers);
        viewersEl.style.color = isLive ? 'var(--green)' : 'var(--muted)';
        statusEl.textContent  = d.online ? (isLive ? '🟢 publicando' : '🟡 sin stream') : '🔴 relay off';
        statusEl.style.color  = d.online ? (isLive ? 'var(--green)' : 'var(--yellow)') : 'var(--red)';
      });
    } catch(_) {}
  }
  poll(); // inmediato
  _relayPollTimer = setInterval(poll, 3000); // cada 3s
}

// ── Animaciones de señal (solo audio canvas; vídeo es iframe) ─────────────────

let _animFrames = [];
function _startSignalAnimations(broadcasts) {
  _animFrames.forEach(id => cancelAnimationFrame(id));
  _animFrames = [];
  broadcasts.forEach(b => {
    const tid = _signalTileId(b.id);
    const cva = document.getElementById('cv-aud-' + tid);
    if (!cva) return;
    const ctx = cva.getContext('2d');
    const W = cva.offsetWidth || 200, H = cva.offsetHeight || 120;
    cva.width = W; cva.height = H;
    let vuL = 0.75, vuR = 0.68, pkL = 0.75, pkR = 0.68;
    const PKD = 0.008;
    function drawAudio() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, W, H);
      const base = Math.min(0.95, 0.5 + (b.audio_kbps || 128) / 512);
      vuL = Math.max(0.05, Math.min(0.98, vuL + (Math.random()-.42)*0.12 + (base-vuL)*0.06));
      vuR = Math.max(0.05, Math.min(0.98, vuR + (Math.random()-.42)*0.12 + (base-vuR)*0.06));
      pkL = Math.max(vuL, pkL - PKD);
      pkR = Math.max(vuR, pkR - PKD);
      const mW = 22, gap = 6, barsTotal = 2*mW + gap;
      const ox = (W - barsTotal) / 2;
      const barH = H * 0.72;
      const barY = H * 0.06;
      [['L', ox, vuL, pkL], ['R', ox+mW+gap, vuR, pkR]].forEach(([label, x, lv, pk]) => {
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(x, barY, mW, barH);
        const segs = 20;
        const filledSegs = Math.round(lv * segs);
        for (let s = 0; s < segs; s++) {
          const sy = barY + barH - (s+1) * (barH/segs);
          const sh = barH/segs - 1;
          const pct = s / segs;
          ctx.fillStyle = s >= filledSegs ? '#1a2a1a'
            : pct < 0.6 ? '#4caf50'
            : pct < 0.8 ? '#ffc107'
            : '#ef5350';
          ctx.fillRect(x+1, sy, mW-2, sh);
        }
        const py = barY + barH - pk*barH - 2;
        ctx.fillStyle = '#fff'; ctx.fillRect(x, py, mW, 2);
        ctx.fillStyle = '#666'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
        ctx.fillText(label, x + mW/2, barY + barH + 11);
      });
      const lufs = -23 + (vuL + vuR - 1.0) * 8;
      const dbfs = -6 + (Math.max(pkL, pkR) - 0.8) * 18;
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${lufs.toFixed(1)} LUFS`, W/2, H*0.94);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText(`pico ${dbfs.toFixed(1)} dBFS`, W/2, H*0.86);
      _animFrames.push(requestAnimationFrame(drawAudio));
    }
    drawAudio();
  });
}

async function addAudioTrackUI(broadcastId) {
  const lang  = prompt('Código de idioma (ej: en, fr, pt):', 'en');
  if (!lang) return;
  const label = prompt('Etiqueta (ej: English):', lang.toUpperCase()) || lang.toUpperCase();
  await api('/admin/audio/tracks/add', {method:'POST', body: JSON.stringify({broadcast_id: broadcastId, lang, label})});
  loadBroadcasts();
}

async function removeAudioTrack(broadcastId, trackId) {
  await api('/admin/audio/tracks/remove', {method:'POST', body: JSON.stringify({broadcast_id: broadcastId, track_id: trackId})});
  loadBroadcasts();
}

async function simAudioAlert(broadcastId, kind) {
  await api('/admin/audio/alerts/simulate', {method:'POST', body: JSON.stringify({broadcast_id: broadcastId, kind})});
  loadBroadcasts();
}

async function resolveAudioAlert(alertId) {
  await api('/admin/audio/alerts/resolve', {method:'POST', body: JSON.stringify({alert_id: alertId})});
  loadBroadcasts();
}

let _injMode = 'synthetic';       // 'synthetic' | 'real'
let _ingestType = 'testsrc2';     // 'testsrc2' | 'srt_push' | 'srt_pull'
let _presets = [];

async function loadPresets() {
  try {
    const r = await api('/admin/broadcasts/presets');
    _presets = await r.json();
    const container = document.getElementById('preset-btns');
    if (!container) return;
    container.innerHTML = _presets.map((p, i) => `
      <button onclick="applyPreset(${i})"
        style="font-size:0.65rem;padding:2px 7px;border-radius:3px;cursor:pointer;
               border:1px solid var(--border);background:none;color:var(--muted)"
        id="preset-${p.id}">${p.label}</button>
    `).join('');
  } catch(_) {}
}

function applyPreset(idx) {
  const p = _presets[idx];
  if (!p) return;
  _setVal('v-res', p.video.resolution);
  _setVal('v-fps', p.video.fps);
  _setVal('v-kbps', p.video.kbps);
  _setVal('v-gop', p.video.gop_frames);
  _setVal('a-kbps', p.audio.kbps);
  _setVal('a-ch', p.audio.channels);
  // resaltar preset activo
  _presets.forEach(x => {
    const btn = document.getElementById('preset-' + x.id);
    if (btn) { btn.style.borderColor='var(--border)'; btn.style.color='var(--muted)'; btn.style.background='none'; }
  });
  const active = document.getElementById('preset-' + p.id);
  if (active) { active.style.borderColor='var(--accent)'; active.style.color='var(--accent)'; active.style.background='rgba(79,195,247,0.12)'; }
  const status = document.getElementById('inj-status');
  if (status) status.textContent = `Preset "${p.label}" aplicado · ${(p.total_kbps/1000).toFixed(1)} Mbps total`;
}

function _setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val;
}

function setInjectMode(mode) {
  _injMode = mode;
  const synBtn  = document.getElementById('mode-syn');
  const realBtn = document.getElementById('mode-real');
  const srtSec  = document.getElementById('srt-section');
  const btnSyn  = document.getElementById('btn-synthetic');
  const btnReal = document.getElementById('btn-real');
  if (mode === 'synthetic') {
    synBtn.style.cssText  += ';background:var(--accent);color:#000;border-color:var(--accent)';
    realBtn.style.cssText += ';background:none;color:var(--muted);border-color:var(--border)';
    srtSec.style.display = 'none';
    btnSyn.style.display = ''; btnReal.style.display = 'none';
  } else {
    realBtn.style.cssText += ';background:var(--accent);color:#000;border-color:var(--accent)';
    synBtn.style.cssText  += ';background:none;color:var(--muted);border-color:var(--border)';
    srtSec.style.display = '';
    btnSyn.style.display = 'none'; btnReal.style.display = '';
    updateSrtEndpointPreview();
  }
}

function setIngestType(type) {
  _ingestType = type;
  const ids = {testsrc2:'src-testsrc', srt_push:'src-push', srt_pull:'src-pull'};
  Object.entries(ids).forEach(([t, id]) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    const active = t === type;
    btn.style.borderColor  = active ? 'var(--accent)' : 'var(--border)';
    btn.style.color        = active ? 'var(--accent)' : 'var(--muted)';
    btn.style.background   = active ? 'rgba(79,195,247,0.15)' : 'none';
  });
  document.getElementById('srt-common').style.display    = type !== 'testsrc2' ? '' : 'none';
  document.getElementById('srt-pull-host').style.display = type === 'srt_pull' ? '' : 'none';
  document.getElementById('srt-push-ep').style.display   = type === 'srt_push' ? '' : 'none';
  if (type === 'srt_push') updateSrtEndpointPreview();
}

function updateSrtEndpointPreview() {
  const el = document.getElementById('srt-ep-url');
  if (!el) return;
  const port = document.getElementById('srt-port')?.value || '9998';
  const lat  = document.getElementById('srt-lat')?.value || '300';
  const bid  = document.getElementById('inj-id')?.value || 'anon/live2';
  const hostIp = window.HOST_IP || window.location.hostname || '0.0.0.0';
  el.textContent = `srt://${hostIp}:${port}?streamid=${bid}&latency=${lat}`;
}

function addInjTrack() {
  const lang  = prompt('Código de idioma (ej: en, fr, pt):', 'en');
  if (!lang) return;
  const label = prompt('Etiqueta:', lang.toUpperCase()) || lang.toUpperCase();
  const container = document.getElementById('inj-tracks');
  const addBtn = container.querySelector('button');
  const span = document.createElement('span');
  span.className = 'inj-track-badge';
  span.dataset.lang = lang; span.dataset.label = label;
  span.textContent = label + ' ×';
  span.style.cssText = 'background:rgba(79,195,247,0.12);border:1px solid rgba(79,195,247,0.25);border-radius:3px;padding:1px 5px;font-size:0.65rem;color:var(--accent);cursor:pointer';
  span.onclick = () => removeInjTrack(span);
  container.insertBefore(span, addBtn);
}

function removeInjTrack(el) {
  const badges = document.querySelectorAll('#inj-tracks .inj-track-badge');
  if (badges.length <= 1) { alert('Debe haber al menos una pista de audio'); return; }
  el.remove();
}

function _getInjPayload() {
  const bid = document.getElementById('inj-id')?.value?.trim() || '';
  const tracks = [...document.querySelectorAll('#inj-tracks .inj-track-badge')]
    .map(el => ({lang: el.dataset.lang, label: el.dataset.label}));
  return {
    broadcast_id: bid,
    video: {
      resolution: document.getElementById('v-res')?.value || '1280x720',
      fps: parseInt(document.getElementById('v-fps')?.value || '30'),
      kbps: parseInt(document.getElementById('v-kbps')?.value || '4000'),
      gop_frames: parseInt(document.getElementById('v-gop')?.value || '30'),
    },
    audio: {
      kbps: parseInt(document.getElementById('a-kbps')?.value || '128'),
      channels: parseInt(document.getElementById('a-ch')?.value || '2'),
      sample_rate: 48000,
      tracks,
    },
  };
}

async function createSynthetic() {
  const st = document.getElementById('inj-status');
  const payload = _getInjPayload();
  if (!payload.broadcast_id) { if(st) st.textContent='⚠ Broadcast ID es obligatorio'; return; }
  if (payload.audio.kbps < 96) { if(st) st.textContent='⚠ Audio mínimo 96 kbps'; return; }
  if(st) st.textContent = 'Creando...';
  try {
    const r = await api('/admin/broadcasts/create', {method:'POST', body: JSON.stringify({...payload, ingest_type:'synthetic'})});
    const d = await r.json();
    if (r.status === 409) { if(st) st.textContent = `⚠ ${d.error}`; return; }
    if(st) st.textContent = `✓ Canal sintético "${payload.broadcast_id}" creado`;
    setTimeout(() => loadBroadcasts(), 600);
  } catch(e) { if(st) st.textContent = 'Error: ' + e.message; }
}

async function injectReal() {
  const st = document.getElementById('inj-status');
  const payload = _getInjPayload();
  if (!payload.broadcast_id) { if(st) st.textContent='⚠ Broadcast ID es obligatorio'; return; }
  const srtPayload = _ingestType !== 'testsrc2' ? {
    port: parseInt(document.getElementById('srt-port')?.value || '9998'),
    latency_ms: parseInt(document.getElementById('srt-lat')?.value || '300'),
    passphrase: document.getElementById('srt-pass')?.value || '',
    host: document.getElementById('srt-host')?.value || '',
  } : undefined;
  if (_ingestType === 'srt_pull' && !srtPayload?.host) {
    if(st) st.textContent = '⚠ Host encoder es obligatorio para SRT Pull'; return;
  }
  if(st) st.textContent = 'Inyectando...';
  try {
    const body = {...payload, ingest_type: _ingestType};
    if (srtPayload) body.srt = srtPayload;
    const r = await api('/admin/broadcasts/inject', {method:'POST', body: JSON.stringify(body)});
    const d = await r.json();
    if(st) st.textContent = d.note || 'OK';
    if (d.ffmpeg_cmd) {
      document.getElementById('ffmpeg-block').style.display = '';
      document.getElementById('ffmpeg-cmd').textContent = d.ffmpeg_cmd;
    }
    setTimeout(() => loadBroadcasts(), 800);
  } catch(e) { if(st) st.textContent = 'Error: ' + e.message; }
}

async function quickTest(btn) {
  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = '⏳...';
  try {
    const r = await api('/admin/broadcasts/quick-test', {method:'POST', body: JSON.stringify({})});
    const d = await r.json();
    if (!r.ok) { alert(d.error || 'Error al crear test rápido'); }
    loadBroadcasts();
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function killBroadcast(id) {
  if (!confirm(`¿Forzar parada de broadcast ${id}?`)) return;
  await api('/admin/broadcasts/kill', {method:'POST', body: JSON.stringify({broadcast_id: id})});
  loadBroadcasts();
}
async function injectBroadcast(id, bitrate) {

  const r = await api('/admin/broadcasts/inject', {method:'POST', body: JSON.stringify({broadcast_id: id, bitrate_kbps: bitrate})});
  const d = await r.json();
  if (st) st.textContent = d.note || 'OK';
  setTimeout(() => loadBroadcasts(), 800);
}
async function injectFromForm() { await injectReal(); }
async function stopInject(id) {
  await api('/admin/broadcasts/stop-inject', {method:'POST', body: JSON.stringify({broadcast_id: id})});
  loadBroadcasts();
}

async function _startGlobalStatusPoll() {
  async function poll() {
    try {
      const rc = await api('/admin/relay/connections');
      const rcData = await rc.json();
      document.getElementById('gs-relay').textContent = rcData.online ? 'relay 🟢' : 'relay 🔴';
      document.getElementById('gs-relay').style.color = rcData.online ? 'var(--green)' : 'var(--red)';

      const bc = await api('/admin/broadcasts');
      const bcData = await bc.json();
      const active = bcData.filter(b => b.status === 'active');
      const viewers = bcData.reduce((s, b) => s + (b.viewers || 0), 0);
      document.getElementById('gs-streams').textContent = `${active.length} señales`;
      document.getElementById('gs-viewers').textContent = `${viewers} viewers`;

      const al = await api('/admin/audio/alerts');
      const alData = await al.json();
      const alertsEl = document.getElementById('gs-alerts');
      alertsEl.textContent = `${alData.length} ${alData.length === 1 ? 'alerta' : 'alertas'}`;
      alertsEl.style.color = alData.length > 0 ? 'var(--red)' : 'var(--muted)';
    } catch (_) {}
  }
  poll();
  setInterval(poll, 10000);
}

    api('/admin/drm/subscriptions'),
    api('/admin/drm/subscriptions/sim-list'),

  const subRows = allSubs.map(s => {
    const pct = s.max_plays ? Math.min(100, Math.round((s.plays_used/s.max_plays)*100)) : 0;
    const bar = s.max_plays ? `<div style="width:80px;height:6px;background:var(--border);border-radius:3px;display:inline-block;margin-left:6px"><div style="width:${pct}%;height:100%;background:${pct>=100?'var(--red)':pct>60?'var(--yellow)':'var(--green)'};border-radius:3px"></div></div>` : '';

      </td></tr>`;
  }).join('');

  const contentRows = contentList.map(c => `<tr>
    <td><code>${c.content_id}</code></td>
    <td><span class="badge blue">${c.drm_system}</span></td>
    <td>${c.availability_windows?.length ? c.availability_windows.map(w=>`${w.start_time.slice(0,10)} → ${w.end_time.slice(0,10)}`).join('<br>') : '—'}</td>
    <td>${c.created_at?.slice(0,16).replace('T',' ')||'—'}</td>

  const geoRows = geoRules.map(g => `<tr>
    <td><code>${g.content_id}</code></td>
    <td>${g.blocked_regions.map(r=>`<span class="badge red">${r}</span>`).join(' ') || '—'}</td>
    <td><button class="btn danger" onclick="deleteGeoRule('${g.content_id}')">Eliminar</button></td>
  </tr>`).join('');

  const logRows = licenseLog.map(e => `<tr>
    <td>${e.ts}</td><td>${e.actor}</td>
    <td><code>${e.action}</code></td><td>${e.detail||'—'}</td>
  </tr>`).join('');

  const inp = (id, ph, w='flex:1') =>

  setContent(`

    <div class="section-title">Estado EZDRM</div>
    <div class="grid-3" style="margin-bottom:1rem">
      <div class="card"><div class="label">Modo</div><div class="value ${cfg.stub_mode?'yellow':'green'}">${cfg.stub_mode?'STUB':'Producción'}</div></div>
      <div class="card"><div class="label">Credenciales</div><div class="value ${cfg.credentials_set?'green':'red'}">${cfg.credentials_set?'✓ Config':'✗ Faltan'}</div></div>
      <div class="card"><div class="label">Whitelabel ID</div><div class="value ${cfg.whitelabel_id_set?'green':'red'}">${cfg.whitelabel_id_set?'✓ Config':'✗ Falta'}</div></div>
      <div class="card"><div class="label">API base URL</div><div class="value" style="font-size:0.75rem;word-break:break-all">${cfg.api_base_url}</div></div>
      <div class="card"><div class="label">Timeout</div><div class="value">${cfg.request_timeout}s</div></div>
    </div>
    ${cfg.stub_mode ? `<div style="background:rgba(255,193,7,0.08);border:1px solid rgba(255,193,7,0.3);border-radius:6px;padding:0.75rem;font-size:0.82rem;margin-bottom:1rem">
      ⚠️ Modo STUB activo — las licencias son ficticias. Para activar EZDRM real, configura
      <code>EZDRM_USERNAME</code>, <code>EZDRM_PASSWORD</code> y <code>EZDRM_WHITELABEL_ID</code>.
    </div>` : ''}

    <!-- Contenidos protegidos -->
    <div class="section-title">Contenidos protegidos por DRM</div>
    <div class="card" style="max-width:700px;margin-bottom:1rem;display:flex;gap:0.75rem;align-items:flex-end;flex-wrap:wrap">
      ${inp('drm-cid','content_id (ej: live1)')}
      <div style="width:160px"><select id="drm-sys" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem">

    </div>

        <input id="drm-id" placeholder="sub_auto" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem"/></div>

      : '<p style="color:var(--muted);font-size:0.85rem">Sin acciones DRM registradas</p>'}`);
}

async function createDrmContent() {
  const cid   = document.getElementById('drm-cid')?.value.trim();
  const sys   = document.getElementById('drm-sys')?.value;
  const start = document.getElementById('drm-win-start')?.value.trim();
  const end   = document.getElementById('drm-win-end')?.value.trim();
  if (!cid) { alert('content_id requerido'); return; }
  const body = { content_id: cid, drm_system: sys };
  if (start && end) body.availability_windows = [{ start_time: start, end_time: end }];
  const r = await api('/admin/drm/content', {method:'POST', body: JSON.stringify(body)});
  if (!r.ok) { const d = await r.json(); alert(d.error); return; }
  loadDRM();
}

async function deleteDrmContent(cid) {
  if (!confirm(`¿Eliminar configuración DRM de "${cid}"?`)) return;
  await api(`/admin/drm/content/${encodeURIComponent(cid)}`, {method:'DELETE'});
  loadDRM();
}

  if (!r.ok) { const d = await r.json(); alert(d.error); return; }
  loadDRM();
}

async function deleteGeoRule(cid) {
  if (!confirm(`¿Eliminar geobloqueo de "${cid}"?`)) return;
  await api(`/admin/drm/geo-rules/${encodeURIComponent(cid)}`, {method:'DELETE'});

}

// ── QoS ───────────────────────────────────────────────────────────────────────
async function loadQoS() {
  const [alertsR, latencyR] = await Promise.all([
    api('/admin/qos/alerts'),
    api('/admin/qos/latency'),
  ]);
  const alertData = await alertsR.json();
  const {alerts} = alertData;
  const latency = await latencyR.json();
  const alertsHtml = alerts.length
    ? alerts.map(a => {
        const sim = a.labels?.source === 'simulated';
        return `<div class="alert-item" style="${sim?'border-color:rgba(255,193,7,0.4);background:rgba(255,193,7,0.08)':''}">
          <span class="aname">${a.labels?.alertname||'?'}</span>
          ${sim ? '<span class="badge yellow" style="margin-left:6px">simulada</span>' : ''}
          — ${a.annotations?.description||a.annotations?.summary||''}
          ${sim ? `<button class="btn" style="float:right;font-size:0.72rem;padding:2px 8px" onclick="resolveAlert('${a.id}')">Resolver</button>` : ''}
        </div>`;
      }).join('')
    : '<p style="color:var(--green);font-size:0.85rem">✓ Sin alertas activas</p>';
  const latRows = latency.map(r => `<tr><td><code>${r.namespace}</code></td>
    <td class="${r.p95>700?'red':''}">${r.p95||0} ms</td><td>${r.samples}</td></tr>`).join('');
  const grafana = window.GRAFANA_URL || 'http://localhost:3000';
  // Comprobar si Grafana está disponible
  let grafanaAvailable = false;
  try {
    const gr = await fetch(`${grafana}/api/health`, {signal: AbortSignal.timeout(2000)});
    grafanaAvailable = gr.ok;
  } catch(e) { grafanaAvailable = false; }

  const grafanaHtml = grafanaAvailable
    ? `<iframe class="grafana" src="${grafana}/d/teremoqwow?orgId=1&kiosk=tv" title="Grafana"></iframe>`
    : `<div style="background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:2rem;text-align:center;color:var(--muted)">
        <div style="font-size:1.5rem;margin-bottom:0.5rem">📊</div>
        <div style="margin-bottom:0.5rem">Grafana no está disponible en modo dev sin Docker</div>
        <div style="font-size:0.8rem">Para ver el dashboard completo: <code style="background:var(--bg);padding:2px 6px;border-radius:4px">docker compose up grafana prometheus</code></div>
        <div style="margin-top:1rem"><a href="${grafana}" target="_blank" style="color:var(--accent)">${grafana}</a></div>
       </div>`;

  const alertNames = ['LipSyncDrift','BufferBelowThreshold','HighE2ELatency','VideoContinuityError'];
  setContent(`
    <div class="section-title">Alertas Prometheus activas ${alertData.simulated?`<span style="color:var(--muted);font-size:0.75rem">(${alertData.simulated} simuladas)</span>`:''}</div>
    ${alertsHtml}
    <div class="section-title" style="margin-top:1.25rem">Consola de pruebas — disparar alerta</div>
    <div class="card" style="max-width:480px;margin-bottom:1rem;display:flex;gap:0.75rem;align-items:flex-end">
      <div style="flex:1"><div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px">Tipo de alerta</div>
        <select id="alert-type" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.4rem;border-radius:4px;font-size:0.85rem">
          ${alertNames.map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select></div>
      <button class="btn" style="border-color:var(--red);color:var(--red)" onclick="fireAlert()">🔥 Disparar</button>
    </div>
    <div class="section-title" style="margin-top:1.25rem">Latencia P95 por broadcast (últimos 15 min)</div>
    <table><thead><tr><th>Namespace</th><th>P95</th><th>Muestras</th></tr></thead><tbody>${latRows}</tbody></table>
    <div class="section-title" style="margin-top:1.25rem">Dashboard Grafana</div>
    ${grafanaHtml}`);
}

async function fireAlert() {

  await api('/admin/qos/alerts/test', {method:'POST', body: JSON.stringify({alert_name: name})});

}

async function startMonitorPolling() {
  if (_monitorInterval) clearInterval(_monitorInterval);
  await pollMonitorSource();
  _monitorInterval = setInterval(pollMonitorSource, 3000);
}

async function pollMonitorSource() {
  const broadcast = document.getElementById('mon-broadcast')?.value || 'anon/live1';
  try {
    const r = await api(`/admin/monitor/source?broadcast=${encodeURIComponent(broadcast)}`);
    const d = await r.json();
    const card = document.getElementById('mon-source-card');
    const overlay = document.getElementById('mon-overlay');
    const statusTxt = document.getElementById('mon-status-text');
    if (!card) return;

    if (d.broadcasting) {
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.5s infinite"></span>
          <span style="color:var(--green);font-weight:600">TRANSMITIENDO</span>
        </div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem">Broadcast: <code>${d.broadcast}</code></div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.25rem">Tracks activos:</div>
        ${d.tracks.map(t=>`<div style="font-size:0.78rem;padding:2px 0;color:var(--text)">· <code>${t}</code></div>`).join('')}
        <div style="margin-top:0.5rem;font-size:0.75rem;color:var(--muted)">Clock: ${d.has_clock?'✓ presente':'—'} · Fuente: ${d.source}</div>`;
      if (overlay) overlay.style.display = 'none';
    } else {
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem">
          <span style="width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block"></span>
          <span style="color:var(--red);font-weight:600">SIN SEÑAL</span>
        </div>
        <div style="font-size:0.82rem;color:var(--muted)">No hay broadcast activo en <code>${d.broadcast}</code></div>
        <div style="margin-top:0.75rem">
          <button class="btn" style="font-size:0.8rem" onclick="injectBroadcast('${d.broadcast}', 4000)">▶ Inyectar stream de prueba</button>
        </div>`;
      if (overlay) { overlay.style.display = 'flex'; if(statusTxt) statusTxt.textContent = 'Sin señal — inyecta un stream primero'; }
    }
  } catch(e) {
    const card = document.getElementById('mon-source-card');
    if (card) card.innerHTML = '<div style="color:var(--red);font-size:0.82rem">Error consultando el relay</div>';
  }
}

function refreshMonitor() {
  const iframe = document.getElementById('mon-player');
  if (iframe) iframe.src = iframe.src;
  pollMonitorSource();
}

function switchOverlayTab(tab) {
  _ovCurrentTab = tab;
  document.getElementById('ov-tab-templates').style.display = tab === 'templates' ? '' : 'none';
  document.getElementById('ov-tab-llm').style.display = tab === 'llm' ? '' : 'none';
  const tBtn = document.getElementById('tab-templates');
  const lBtn = document.getElementById('tab-llm');
  tBtn.style.background = tab === 'templates' ? 'var(--accent)' : 'none';
  tBtn.style.color = tab === 'templates' ? '#000' : 'var(--muted)';
  lBtn.style.background = tab === 'llm' ? 'var(--accent)' : 'none';
  lBtn.style.color = tab === 'llm' ? '#000' : 'var(--muted)';
}

async function selectOverlayTemplate(templateId) {
  document.querySelectorAll('[id^=tmpl-card-]').forEach(el => {
    el.style.borderColor = 'var(--border)';
    el.style.background = 'var(--surface)';
  });
  const card = document.getElementById(`tmpl-card-${templateId}`);
  if (card) { card.style.borderColor = 'var(--accent)'; card.style.background = 'rgba(79,195,247,0.08)'; }

  _ovSelectedTemplate = templateId;
  const form = document.getElementById('ov-form');
  form.style.display = '';
  document.getElementById('ov-form-title').textContent = templateId;

  try {
    const r = await api(`/admin/overlays/templates/${templateId}`);
    const meta = await r.json();
    const fields = document.getElementById('ov-form-fields');
    const required = meta.vars?.required || [];
    const optional = meta.vars?.optional || [];
    fields.innerHTML = [...required.map(v => `
      <div style="margin-bottom:0.4rem">
        <div style="font-size:0.65rem;color:var(--accent)">* ${v}</div>
        <input id="ov-field-${v}" placeholder="${v}" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:3px;font-size:0.8rem"/>
      </div>`),
      ...optional.map(v => `
      <div style="margin-bottom:0.4rem">
        <div style="font-size:0.65rem;color:var(--muted)">${v} (opcional)</div>
        <input id="ov-field-${v}" placeholder="${v}" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:3px;font-size:0.8rem"/>
      </div>`),
    ].join('');
  } catch(_) {}
}

function _collectFormData(vars) {
  const data = {};
  for (const v of vars) {
    const el = document.getElementById(`ov-field-${v}`);
    if (el && el.value.trim()) data[v] = el.value.trim();
  }
  return data;
}

async function publishOverlay() {
  const st = document.getElementById('ov-status');
  const broadcastId = document.getElementById('ov-broadcast')?.value;
  const zone = document.getElementById('ov-zone')?.value;
  const durationMs = (parseInt(document.getElementById('ov-duration')?.value || '10') || 0) * 1000;
  if (!_ovSelectedTemplate || !broadcastId) {
    if (st) st.textContent = '⚠ Selecciona un template y un broadcast';
    return;
  }
  if (st) st.textContent = 'Publicando...';
  try {
    const r = await api(`/admin/overlays/templates/${_ovSelectedTemplate}`);
    const meta = await r.json();
    const allVars = [...(meta.vars?.required||[]), ...(meta.vars?.optional||[])];
    const data = _collectFormData(allVars);

    const res = await api('/admin/overlays/publish', {
      method: 'POST',
      body: JSON.stringify({
        broadcast_id: broadcastId,
        template_id: _ovSelectedTemplate,
        zone,
        duration_ms: durationMs,
        animation: 'fade',
        data,
      }),
    });
    const d = await res.json();
    if (!res.ok) { if (st) st.textContent = `⚠ ${d.error}`; return; }
    if (st) st.textContent = `✓ Overlay ${d.overlay_id.slice(0,8)}… publicado`;
    setTimeout(() => loadOverlays(), 800);
  } catch(e) { if (st) st.textContent = 'Error: ' + e.message; }
}

async function unpublishOverlay(overlayId, broadcastId) {
  await api('/admin/overlays/unpublish', { method: 'POST', body: JSON.stringify({overlay_id: overlayId, broadcast_id: broadcastId}) });
  loadOverlays();
}

async function clearAllOverlays(broadcastId) {
  if (!broadcastId || !confirm(`¿Limpiar todos los overlays de ${broadcastId}?`)) return;
  await api('/admin/overlays/clear-all', { method: 'POST', body: JSON.stringify({broadcast_id: broadcastId}) });
  loadOverlays();
}

async function republishOverlay(ovData) {
  const broadcastId = document.getElementById('ov-broadcast')?.value || ovData.broadcast_id;
  await api('/admin/overlays/publish', {
    method: 'POST',
    body: JSON.stringify({...ovData, broadcast_id: broadcastId}),
  });
  loadOverlays();
}

async function generateLLMOverlay() {
  const st = document.getElementById('ov-llm-status');
  const prompt = document.getElementById('ov-llm-prompt')?.value.trim();
  const zone = document.getElementById('ov-llm-zone')?.value;
  const broadcastId = document.getElementById('ov-broadcast')?.value || '';
  if (!prompt) { if (st) st.textContent = '⚠ Escribe un prompt'; return; }
  if (st) st.textContent = 'Generando...';
  document.getElementById('ov-llm-preview').style.display = 'none';
  try {
    const res = await api('/admin/overlays/generate-llm', {
      method: 'POST',
      body: JSON.stringify({prompt, zone_hint: zone || 'bottom-bar', broadcast_id: broadcastId}),
    });
    const d = await res.json();
    if (!res.ok) { if (st) st.textContent = `⚠ ${d.error}`; return; }
    _ovLLMCandidate = {...d.candidate, broadcast_id: broadcastId};
    document.getElementById('ov-llm-json').textContent = JSON.stringify(d.candidate, null, 2);
    document.getElementById('ov-llm-preview').style.display = '';
    if (st) st.textContent = `Confianza: ${Math.round((d.candidate.confidence||0)*100)}% · ${d.candidate.explanation||''}`;
  } catch(e) { if (st) st.textContent = 'Error: ' + e.message; }
}

async function publishLLMCandidate() {
  if (!_ovLLMCandidate) return;
  const broadcastId = _ovLLMCandidate.broadcast_id || document.getElementById('ov-broadcast')?.value || '';
  await api('/admin/overlays/publish', {
    method: 'POST',
    body: JSON.stringify({..._ovLLMCandidate, broadcast_id: broadcastId}),
  });
  _ovLLMCandidate = null;
  document.getElementById('ov-llm-preview').style.display = 'none';
  loadOverlays();
}

function previewOverlay() {
  const bc = document.getElementById('ov-broadcast')?.value;
  const zone = document.getElementById('ov-zone')?.value;
  alert(`Vista previa: template "${_ovSelectedTemplate}" en zona "${zone}" del broadcast "${bc}"\n(El preview real requiere el player activo)`);
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (token) {
  try {
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (payload.exp > Date.now()/1000) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('user-email').textContent = payload.email;
      document.getElementById('sidebar-user').textContent = `${payload.role} · ${payload.email}`;
      loadPage(currentPage);
    } else { token = ''; localStorage.removeItem('admin_token'); }
  } catch(e) { token = ''; localStorage.removeItem('admin_token'); }
}
