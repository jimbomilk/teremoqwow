<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>teremoqwow Admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>⚡ teremoqwow Admin</h2>
    <div class="form-field">
      <label>Email</label>
      <input id="login-email" type="email" value="admin@teremoqwow.dev" />
    </div>
    <div class="form-field">
      <label>Password</label>
      <input id="login-password" type="password" value="dev-secret" />
    </div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <header>
    <h1>⚡ teremoqwow</h1>
    <p>Admin panel</p>
  </header>
  <nav id="nav">
    <div class="nav-item active" data-page="broadcasts" onclick="navigate(this)">📡 Broadcasts</div>
    <div class="nav-item" data-page="federation" onclick="navigate(this)">🌐 Federación</div>
    <div class="nav-item" data-page="drm" onclick="navigate(this)">🔒 DRM / Rights</div>
    <div class="nav-item" data-page="monetization" onclick="navigate(this)">💳 Monetización</div>
    <div class="nav-item" data-page="qos" onclick="navigate(this)">📊 QoS</div>
    <div class="nav-item" data-page="security" onclick="navigate(this)">🛡️ Seguridad</div>
    <div class="nav-item" data-page="flags" onclick="navigate(this)">🚩 Feature Flags</div>
    <div class="nav-item" data-page="audit" onclick="navigate(this)">📋 Auditoría</div>
    <div class="nav-item" data-page="overlays" onclick="navigate(this)">🎨 Overlays</div>
  </nav>
  <footer id="sidebar-user">—</footer>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <span class="title" id="page-title">Broadcasts</span>
    <div id="global-status" style="display:flex;align-items:center;gap:0.75rem;font-size:0.75rem">
      <span id="gs-relay">relay ●</span>
      <span id="gs-krakend">krakend ●</span>
      <span id="gs-streams">— señales</span>
      <span id="gs-viewers">— viewers</span>
      <span id="gs-alerts" style="cursor:pointer" onclick="navigate(document.querySelector('[data-page=broadcasts]'))">0 alertas</span>
    </div>
    <span class="user">
      <span id="user-email"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </span>
  </div>
  <div id="content"><div class="loading">Cargando...</div></div>
</div>

<script type="module" src="/admin/js/main.js"></script>
</body>
</html>
