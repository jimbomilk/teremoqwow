<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teremoqwow Player — Phase 0</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        padding: 2rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 1rem;
        font-size: 1.8rem;
      }

      .info {
        background: #2a2a2a;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }

      .info p {
        margin: 0.5rem 0;
      }

      .info code {
        background: #1a1a1a;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
      }

      moq-watch {
        display: block;
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        border: 2px solid #444;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }

      .stats {
        background: #2a2a2a;
        padding: 1rem;
        margin-top: 1.5rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-family: 'Courier New', monospace;
      }

      .stats h3 {
        margin-bottom: 0.5rem;
        color: #fff;
      }

      .stat-item {
        display: flex;
        justify-content: space-between;
        margin: 0.25rem 0;
      }

      .stat-label {
        color: #999;
      }

      .stat-value {
        color: #4fc3f7;
        font-weight: bold;
      }

      .error {
        background: #ff5252;
        color: #fff;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
      }

      .success {
        background: #4caf50;
        color: #fff;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎥 teremoqwow Player — Phase 0</h1>

      <div class="info">
        <p>
          <strong>URL:</strong> <code>https://relay:4443</code>
        </p>
        <p>
          <strong>Namespace:</strong> <code>teremoqwow/dev/live1</code>
        </p>
        <p>
          <strong>Broadcast:</strong> <code>video-high</code> (Phase 0: primera rendition del
          selection_group <code>video-abr</code>)
        </p>
      </div>

      <moq-watch
        url="https://relay:4443"
        namespace="teremoqwow/dev/live1"
        broadcast="video-high"
      ></moq-watch>

      <div class="stats" id="stats">
        <h3>📊 Estadísticas</h3>
        <div class="stat-item">
          <span class="stat-label">Estado:</span>
          <span class="stat-value" id="status">Inicializando...</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Latencia glass-to-glass:</span>
          <span class="stat-value" id="latency">-- ms</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Frames decodificados:</span>
          <span class="stat-value" id="frames">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Codec:</span>
          <span class="stat-value" id="codec">--</span>
        </div>
      </div>

      <div id="error-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
