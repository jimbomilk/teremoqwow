# teremoqwow — stack de producción (Vultr)
# Uso: docker compose -f docker-compose.prod.yml up -d
# Prerrequisitos en el servidor:
#   - /etc/teremoqwow/.env (ver .env.example)
#   - /etc/letsencrypt/live/<DOMAIN>/{fullchain,privkey}.pem
#   - Red externa teremoqwow-prod: docker network create teremoqwow-prod

networks:
  teremoqwow-prod:
    external: true

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
  clickhouse-data:

services:

  # ── MoQ Relay ──────────────────────────────────────────────────────────────
  moq-relay:
    image: moqdev/moq-relay:0.15.7
    networks: [teremoqwow-prod]
    ports:
      - "4443:4443/udp"
      - "4443:4443/tcp"
      - "4444:4444"
    volumes:
      - /etc/letsencrypt/live/wow.teremoq.com/fullchain.pem:/certs/relay.pem:ro
      - /etc/letsencrypt/live/wow.teremoq.com/privkey.pem:/certs/relay.key:ro
    command: >
      --listen [::]:4443
      --listen-tls-cert /certs/relay.pem
      --listen-tls-key /certs/relay.key
      --listen-tcp-bind [::]:4444
      --auth-public "anon/**"
      --web-http-listen [::]:8090
    healthcheck:
      # moq-relay no tiene curl/wget — usamos el puerto TCP como proxy
      test: ["CMD-SHELL", "nc -z localhost 4444 && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── SRT Ingest (Larix Broadcaster → relay) ────────────────────────────────
  # `moq import srt --listen` acepta SRT caller (MPEG-TS H.264+AAC) y publica
  # en anon/live1 vía TCP interno del relay. Ver docs/runbooks/srt-larix-ingest.md.
  # Sin healthcheck: el listener es UDP y la imagen no tiene sonda UDP (ni nc).
  # SIN autenticación: el CLI no soporta passphrase y el streamid no se valida.
  srt-ingest:
    image: moqdev/moq:0.12.7
    networks: [teremoqwow-prod]
    ports:
      - "8890:8890/udp"
    command:
      - --connect
      - tcp://moq-relay:4444/anon
      - --broadcast
      - anon/live1
      - import
      - srt
      - --listen
      - "[::]:8890"
      - --latency
      - 500ms
    depends_on:
      moq-relay:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "2" }

  # ── Source FFmpeg (testsrc2 + audio deterministas) ───────────────────────────
  # Publica vídeo+audio sintéticos por SRT a srt-ingest:8890 (streamid live1).
  # Prerrequisito de ingesta (Fase 0). Ver docs/runbooks/source-ffmpeg.md.
  # Sin puertos publicados: comunica internamente vía srt-ingest en red teremoqwow-prod.
  # Si termina, docker lo reinicia automáticamente.
  source-ffmpeg:
    image: jrottenberg/ffmpeg:7.1-alpine
    networks: [teremoqwow-prod]
    # Nota: Esperar a srt-ingest garantiza que el listener UDP está listo.
    # Si srt-ingest falla conectar al relay, ffmpeg puede reintentar vía restart policy.
    # Video: testsrc2 determinista (patrón de test)
    # Audio: sine 1kHz determinista
    command:
      # Entrada: testsrc2 a 1280x720 30fps
      - -f
      - lavfi
      - -i
      - "testsrc2=s=1280x720:r=30:d=0"
      # Entrada: sine 1000Hz (audio determinista)
      - -f
      - lavfi
      - -i
      - "sine=f=1000:r=48000:d=0"
      # Map: video directo + audio directo (sin filtros complejos)
      - -map
      - "0"
      - -map
      - "1"
      # Codificación vídeo: H.264 baseline, yuv420p, GOP ≤60 (1s @ 30fps para low-latency)
      - -c:v
      - libx264
      - -profile:v
      - baseline
      - -bf
      - "0"
      - -g
      - "60"
      - -keyint_min
      - "60"
      - -sc_threshold
      - "0"
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -r
      - "30"
      # Codificación audio: AAC 48kHz 2ch
      - -c:a
      - aac
      - -ar
      - "48000"
      - -ac
      - "2"
      - -b:a
      - 128k
      # Output: MPEG-TS a SRT
      - -f
      - mpegts
      - "srt://srt-ingest:8890?mode=caller&streamid=live1&latency=500"
    depends_on:
      srt-ingest:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── KrakenD API Gateway ────────────────────────────────────────────────────
  krakend:
    image: devopsfaith/krakend:2.6
    networks: [teremoqwow-prod]
    ports:
      - "8080:8080"
    volumes:
      - ./config/krakend/krakend.json:/etc/krakend/krakend.json:ro
    environment:
      KRAKEND_CONFIG: /etc/krakend/krakend.json
    depends_on:
      billing-webhook:
        condition: service_started
      registry-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Billing Webhook ────────────────────────────────────────────────────────
  billing-webhook:
    build:
      context: ./comercial/billing
      dockerfile: Dockerfile
    networks: [teremoqwow-prod]
    env_file: /home/deploy/.env
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Registry Server ────────────────────────────────────────────────────────
  registry-server:
    build:
      context: ./relay
      dockerfile: Dockerfile
    networks: [teremoqwow-prod]
    env_file: /home/deploy/.env
    volumes:
      - ./schemas:/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Auth ──────────────────────────────────────────────────────────────────
  auth:
    build:
      context: ./comercial/auth
      dockerfile: Dockerfile
    networks: [teremoqwow-prod]
    env_file: /home/deploy/.env
    volumes:
      - /home/deploy/private.pem:/home/deploy/private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9002"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Portal Cliente ────────────────────────────────────────────────────────
  portal:
    build:
      context: ./comercial/portal
      dockerfile: Dockerfile
    networks: [teremoqwow-prod]
    env_file: /home/deploy/.env
    depends_on:
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Player (Vite build → nginx) ───────────────────────────────────────────
  player:
    build:
      context: ./player
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_MOQ_RELAY_URL: https://wow.teremoq.com:4443/anon
        VITE_RELAY_BROADCAST: anon/live1
        VITE_MOQ_CERT_HASH: ""
    networks: [teremoqwow-prod]
    depends_on:
      moq-relay:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "2" }

  # ── Admin API ─────────────────────────────────────────────────────────────
  admin-api:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: api
    networks: [teremoqwow-prod]
    env_file: /home/deploy/.env
    volumes:
      - ./overlays/templates:/app/overlays/templates:ro
      - /home/deploy/private.pem:/home/deploy/private.pem:ro
    depends_on:
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9004"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Admin Frontend ────────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: frontend
    networks: [teremoqwow-prod]
    depends_on:
      admin-api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "2" }

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks: [teremoqwow-prod]
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "2" }

  # ── ClickHouse ─────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    networks: [teremoqwow-prod]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    env_file: /home/deploy/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    networks: [teremoqwow-prod]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
      - --web.listen-address=:9090
    depends_on:
      moq-relay:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "2" }

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    networks: [teremoqwow-prod]
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    env_file: /home/deploy/.env
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "2" }

  # ── nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    networks: [teremoqwow-prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - player
      - krakend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
