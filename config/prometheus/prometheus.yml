global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Retention time: set via CLI flag: --storage.tsdb.retention.time=30d
  # This ensures telemetry data is kept for 30 days before deletion

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: moq-relay
    static_configs:
      # moq-relay 0.15.7 expone métricas en el puerto web (8090)
      - targets: ['moq-relay:8090']
    metrics_path: /metrics

  - job_name: krakend
    static_configs:
      - targets: ['krakend:9090']
    metrics_path: /metrics

  - job_name: billing-webhook
    static_configs:
      - targets: ['billing-webhook:9000']
    metrics_path: /metrics

  - job_name: registry-server
    static_configs:
      - targets: ['registry-server:8081']
    metrics_path: /metrics
