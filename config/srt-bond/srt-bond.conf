# srt-bond — parámetros de configuración (issue #53)
# Formato KEY=value compatible con docker-compose env_file.
# Sobrescribir con variables de entorno del entorno de despliegue.
# Nunca incluir secretos ni certificados en este archivo.

# Puertos de escucha del bond (encoders se conectan como callers)
PRIMARY_PORT=8891
BACKUP_PORT=8892

# Destino MediaMTX (resuelto por DNS de red Docker)
MEDIAMTX_HOST=mediamtx
MEDIAMTX_PORT=8890
MEDIAMTX_PATH=live-main

# Parámetros SRT
SRT_LATENCY_MS=200

# Pausa en segundos antes de reintentar el primario tras caída de ambos enlaces
RECONNECT_DELAY_S=1
