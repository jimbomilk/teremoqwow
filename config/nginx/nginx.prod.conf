worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Resolver DNS de Docker para upstreams dinámicos
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Redirigir todo HTTP a HTTPS
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/wow.teremoq.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wow.teremoq.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # Raíz → admin UI
        location = / {
            return 302 /admin/;
        }

        # Player — strip /player/ prefix; proxy_pass estático sí hace strip automático
        location /player/ {
            proxy_pass http://player:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway
        location /api/ {
            proxy_pass http://krakend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin UI — variable para resolución dinámica (no falla al arranque)
        location /admin/ {
            set $admin_upstream http://admin:3001;
            proxy_pass $admin_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin API — strip /admin-api/ prefix antes de proxy a :9004
        # set debe ir ANTES de rewrite+break (break detiene directivas rewrite siguientes).
        location /admin-api/ {
            set $admin_api_upstream http://admin-api:9004;
            rewrite ^/admin-api/(.*) /$1 break;
            proxy_pass $admin_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
        }
    }
}
