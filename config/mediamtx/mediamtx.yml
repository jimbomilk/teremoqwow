###############################################################################
# MediaMTX — Ingesta SRT (issue #52)
# Imagen: bluenviron/mediamtx:latest
###############################################################################

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logLevel: info
logDestinations: [stdout]

# ---------------------------------------------------------------------------
# Protocolos deshabilitados en esta fase
# ---------------------------------------------------------------------------
rtsp: no
rtmp: no
hls: no
webrtc: no

# ---------------------------------------------------------------------------
# SRT listener
# ---------------------------------------------------------------------------
srt: yes
srtAddress: :8890

# ---------------------------------------------------------------------------
# API HTTP de control
# ---------------------------------------------------------------------------
api: yes
apiAddress: :9997

# ---------------------------------------------------------------------------
# Métricas Prometheus
# ---------------------------------------------------------------------------
metrics: yes
metricsAddress: :9998

# ---------------------------------------------------------------------------
# Paths de ingesta
# El streamid SRT determina el path: publish:<path> / read:<path>
# ---------------------------------------------------------------------------
paths:
  live-main:
    source: publisher

  live-backup:
    source: publisher
