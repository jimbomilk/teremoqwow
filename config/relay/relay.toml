# relay.toml — Configuración del relay MoQ (moq-relay 0.15.x)
# Referencia: https://github.com/kixelated/moq-rs
#
# IMPORTANTE (issue #116): moq-relay 0.15.x lee flags CLI, no secciones TOML
# estructuradas. Este fichero usa el formato plano (clave = valor) que el
# binario acepta via --config. Verificado en la validación E2E 2026-09-27.
#
# Jerarquía: variable de entorno > este archivo > defaults del binario.
# Nunca commitees certificados reales. Ver certs/README.md.

# ── QUIC listener (MoQ/WebTransport) ─────────────────────────────────────────
# Puerto estándar MoQ sobre QUIC+TLS. En Linux, puertos <1024 requieren
# CAP_NET_BIND_SERVICE; usa 4443 para dev sin permisos de root.
listen = "[::]:4443"

# ── TLS ───────────────────────────────────────────────────────────────────────
# Rutas relativas al directorio de trabajo donde se lanza el binario.
# ⚠️  WebTransport (Chrome) exige validez ≤ 14 días cuando se usa
#     serverCertificateHashes. Genera los certs con scripts/renew-dev-certs.sh.
listen_tls_cert = "./certs/relay.pem"
listen_tls_key  = "./certs/relay.key"

# ── TCP listener qmux (fallback sin QUIC) ────────────────────────────────────
# Necesario para clientes que no tienen acceso QUIC nativo, como entornos WSL2
# donde el kernel de Windows bloquea UDP en ciertas configuraciones. El relay
# tuneliza MoQ sobre TCP con encuadre qmux en este puerto.
listen_tcp_bind = "[::]:4444"

# ── Autenticación ─────────────────────────────────────────────────────────────
# Patrón glob de rutas que pueden publicarse/suscribirse sin JWT.
# "anon/**" permite acceso anónimo completo (solo para dev/staging).
# Para producción, reemplaza por un patrón más restrictivo o elimina esta línea
# y configura JWT con auth_jwks_url / auth_jwks_file.
auth_public = ["anon/**"]

# ── HTTP debug (fingerprint · /announced) ────────────────────────────────────
# Expone /fingerprint (hash SHA-256 del cert TLS) y /announced (tracks activos).
# El player web lo usa para obtener el hash del cert sin intervención manual.
web_http_listen = "[::]:8090"

# ── Logging ───────────────────────────────────────────────────────────────────
log_level = "info"

# ── DEV OVERRIDE ──────────────────────────────────────────────────────────────
# Para sobreescribir valores sin editar este fichero, exporta variables de
# entorno con el prefijo MOQ_RELAY_ (kebab→SCREAMING_SNAKE, guiones→guiones bajos):
#
#   export MOQ_RELAY_LISTEN="[::]:4443"
#   export MOQ_RELAY_LISTEN_TLS_CERT="/ruta/absoluta/relay.pem"
#   export MOQ_RELAY_LISTEN_TLS_KEY="/ruta/absoluta/relay.key"
#   export MOQ_RELAY_LISTEN_TCP_BIND="[::]:4444"
#   export MOQ_RELAY_AUTH_PUBLIC="anon/**"
#   export MOQ_RELAY_WEB_HTTP_LISTEN="[::]:8090"
#   export MOQ_RELAY_LOG_LEVEL="debug"
#
# Útil en CI o cuando varios devs comparten la misma imagen Docker.

# ── Dynamic Track Switching (DTS) ─────────────────────────────────────────────
# moq-relay 0.15.x soporta DTS de forma nativa: los tracks publicados bajo
# el mismo namespace y misma 'selection_group' en el catálogo son conmutables
# por el subscriber en fronteras de grupo (cada IDR = 2s en nuestra config).
#
# El relay no requiere configuración adicional. Los umbrales de conmutación
# son responsabilidad del player ABR (ver player/src/moq-watch.ts y issue #60).
#
# Umbrales documentados (basados en benchmarks del preset ABR de Fase 1):
#   High  (1280x720 @3000kbps) → activar cuando throughput > 4000 kbps
#   Medium (854x480  @2000kbps) → activar cuando 2500 < throughput ≤ 4000 kbps
#   Low   (640x360  @1000kbps) → activar cuando throughput ≤ 2500 kbps
#
# Para verificar que los 3 tracks están anunciados tras arrancar la pipeline:
#   curl http://localhost:8090/announced/
#
# El relay acepta suscripciones con el campo switching_set_id y lo respeta de
# forma nativa (moq-relay 0.15.x): los subscribers pueden incluirlo para
# indicar pertenencia a un switching set y el relay conmuta dentro del grupo.
