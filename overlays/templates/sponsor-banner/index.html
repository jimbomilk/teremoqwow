<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Arial, sans-serif; }
    #banner {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); padding: 10px 16px;
    }
    #sponsor-label { font-size: 11px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.06em; }
    #sponsor-img { max-height: 50px; max-width: 80%; object-fit: contain; display: block; }
    #advertiser-name { font-size: 16px; font-weight: 700; color: #fff; }
    #cta {
      padding: 6px 16px; background: #fff; color: #000;
      border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; display: none;
    }
  </style>
</head>
<body>
  <div id="banner">
    <span id="sponsor-label">Patrocinado por</span>
    <img id="sponsor-img" src="" alt="">
    <span id="advertiser-name"></span>
    <button id="cta"></button>
  </div>
  <script>
    var sponsorImg = document.getElementById('sponsor-img');
    var advertiserName = document.getElementById('advertiser-name');
    var cta = document.getElementById('cta');
    var ctaUrl = null;

    function render(data) {
      advertiserName.textContent = data.advertiser || '';
      if (data.image_url) { sponsorImg.src = data.image_url; sponsorImg.alt = data.advertiser || ''; }
      if (data.cta_text) {
        cta.textContent = data.cta_text;
        cta.style.display = 'block';
        ctaUrl = data.cta_url || null;
      }
    }

    cta.addEventListener('click', function() {
      parent.postMessage({ type: 'overlay:action', payload: { kind: 'cta_click', cta_url: ctaUrl } }, '*');
    });

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'overlay:data') {
        render(event.data.payload || {});
        parent.postMessage({ type: 'overlay:ready' }, '*');
      }
    });
  </script>
</body>
</html>
