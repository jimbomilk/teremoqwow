<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Arial, sans-serif; }
    #card {
      display: inline-flex; align-items: stretch;
      max-width: 100%; overflow: hidden;
      animation: slide-in 0.35s ease-out both;
    }
    @keyframes slide-in { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #accent-bar { width: 5px; background: #e53935; flex-shrink: 0; }
    #content { background: rgba(10,10,10,0.88); padding: 8px 16px 8px 12px; display: flex; align-items: center; gap: 10px; }
    #logo { width: 40px; height: 40px; object-fit: contain; display: none; }
    #logo.visible { display: block; }
    #texts {}
    #title { font-size: 20px; font-weight: 700; color: #fff; white-space: nowrap; }
    #subtitle { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="card">
    <div id="accent-bar"></div>
    <div id="content">
      <img id="logo" src="" alt="">
      <div id="texts">
        <div id="title"></div>
        <div id="subtitle"></div>
      </div>
    </div>
  </div>
  <script>
    var accentBar = document.getElementById('accent-bar');
    var logo = document.getElementById('logo');
    var titleEl = document.getElementById('title');
    var subtitleEl = document.getElementById('subtitle');

    function render(data) {
      titleEl.textContent = data.title || '';
      subtitleEl.textContent = data.subtitle || '';
      if (data.accent) accentBar.style.background = data.accent;
      if (data.logo_url) { logo.src = data.logo_url; logo.classList.add('visible'); }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'overlay:data') {
        render(event.data.payload || {});
        parent.postMessage({ type: 'overlay:ready' }, '*');
      }
    });
  </script>
</body>
</html>
