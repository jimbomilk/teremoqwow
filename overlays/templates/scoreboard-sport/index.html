<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Arial, sans-serif; }
    #board {
      display: flex; align-items: stretch;
      background: rgba(10,10,25,0.9); border-radius: 6px;
      overflow: hidden; width: 100%; height: 100%;
    }
    .team {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 6px 8px; gap: 4px;
    }
    .team-logo { width: 32px; height: 32px; object-fit: contain; display: none; }
    .team-logo.visible { display: block; }
    .team-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); text-align: center; }
    #scores {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 4px 14px; background: rgba(255,255,255,0.08); flex-shrink: 0; min-width: 72px;
    }
    #score-line { display: flex; align-items: center; gap: 6px; }
    .score { font-size: 28px; font-weight: 900; color: #fff; }
    .score-sep { font-size: 22px; color: rgba(255,255,255,0.4); }
    #info { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; text-align: center; }
  </style>
</head>
<body>
  <div id="board">
    <div class="team" id="home-team">
      <img class="team-logo" id="home-logo" src="" alt="">
      <span class="team-name" id="home-name"></span>
    </div>
    <div id="scores">
      <div id="score-line">
        <span class="score" id="home-score"></span>
        <span class="score-sep">–</span>
        <span class="score" id="away-score"></span>
      </div>
      <div id="info"></div>
    </div>
    <div class="team" id="away-team">
      <img class="team-logo" id="away-logo" src="" alt="">
      <span class="team-name" id="away-name"></span>
    </div>
  </div>
  <script>
    function render(data) {
      document.getElementById('home-name').textContent = data.home_name || '';
      document.getElementById('away-name').textContent = data.away_name || '';
      document.getElementById('home-score').textContent = String(data.home_score ?? 0);
      document.getElementById('away-score').textContent = String(data.away_score ?? 0);
      var info = [];
      if (data.period) info.push(data.period);
      if (data.clock) info.push(data.clock);
      document.getElementById('info').textContent = info.join(' · ');
      if (data.home_logo_url) {
        var hl = document.getElementById('home-logo');
        hl.src = data.home_logo_url; hl.classList.add('visible');
      }
      if (data.away_logo_url) {
        var al = document.getElementById('away-logo');
        al.src = data.away_logo_url; al.classList.add('visible');
      }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'overlay:data') {
        render(event.data.payload || {});
        parent.postMessage({ type: 'overlay:ready' }, '*');
      }
    });
  </script>
</body>
</html>
