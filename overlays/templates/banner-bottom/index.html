<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Arial, sans-serif; }
    #banner {
      display: flex; align-items: center; gap: 12px;
      width: 100%; height: 100%; padding: 8px 16px;
      background: rgba(0,0,0,0.82);
    }
    #thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; flex-shrink: 0; display: none; }
    #thumb.visible { display: block; }
    #texts { flex: 1; min-width: 0; }
    #main-text { font-size: 18px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sub-text { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px; }
    #cta {
      padding: 6px 14px; background: #e53935; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; display: none;
    }
    #cta.visible { display: block; }
  </style>
</head>
<body>
  <div id="banner">
    <img id="thumb" src="" alt="">
    <div id="texts">
      <div id="main-text"></div>
      <div id="sub-text"></div>
    </div>
    <button id="cta"></button>
  </div>
  <script>
    var thumb = document.getElementById('thumb');
    var mainText = document.getElementById('main-text');
    var subText = document.getElementById('sub-text');
    var cta = document.getElementById('cta');
    var ctaUrl = null;

    function render(data) {
      mainText.textContent = data.text || '';
      subText.textContent = data.subtext || '';
      if (data.image_url) { thumb.src = data.image_url; thumb.classList.add('visible'); }
      if (data.cta_text) {
        cta.textContent = data.cta_text;
        cta.classList.add('visible');
        ctaUrl = data.cta_url || null;
      }
    }

    cta.addEventListener('click', function() {
      parent.postMessage({ type: 'overlay:action', payload: { kind: 'cta_click', cta_url: ctaUrl } }, '*');
    });

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'overlay:data') {
        render(event.data.payload || {});
        parent.postMessage({ type: 'overlay:ready' }, '*');
      }
    });
  </script>
</body>
</html>
