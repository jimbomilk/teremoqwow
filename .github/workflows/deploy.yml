name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: "Forzar deploy completo de todos los servicios"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Detectar qué servicios cambiaron ─────────────────────────────────────────
  detect:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      auth:     ${{ steps.f.outputs.auth }}
      billing:  ${{ steps.f.outputs.billing }}
      portal:   ${{ steps.f.outputs.portal }}
      registry: ${{ steps.f.outputs.registry }}
      admin:    ${{ steps.f.outputs.admin }}
      player:   ${{ steps.f.outputs.player }}
      infra:    ${{ steps.f.outputs.infra }}
      config:   ${{ steps.f.outputs.config }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            auth:
              - 'comercial/auth/**'
            billing:
              - 'comercial/billing/**'
            portal:
              - 'comercial/portal/**'
            registry:
              - 'relay/**'
            admin:
              - 'admin/**'
            player:
              - 'player/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'config/nginx/**'
              - '.github/workflows/deploy.yml'
            config:
              - 'config/krakend/**'
              - 'config/prometheus/**'
              - 'schemas/**'
              - 'overlays/**'

  # ── Deploy selectivo ──────────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resumen de cambios detectados
        run: |
          echo "auth=${{ needs.detect.outputs.auth }}"
          echo "billing=${{ needs.detect.outputs.billing }}"
          echo "portal=${{ needs.detect.outputs.portal }}"
          echo "registry=${{ needs.detect.outputs.registry }}"
          echo "admin=${{ needs.detect.outputs.admin }}"
          echo "player=${{ needs.detect.outputs.player }}"
          echo "infra=${{ needs.detect.outputs.infra }}"
          echo "config=${{ needs.detect.outputs.config }}"
          echo "force_full=${{ github.event.inputs.force_full }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          timeout: 600s
          # envs lista las variables de env: que se inyectan en el script SSH
          envs: CHANGED_AUTH,CHANGED_BILLING,CHANGED_PORTAL,CHANGED_REGISTRY,CHANGED_ADMIN,CHANGED_PLAYER,CHANGED_INFRA,CHANGED_CONFIG,FORCE_FULL
          script: |
            REPO_DIR=/opt/teremoqwow
            # Guardar FORCE_FULL ANTES del export del .env (que podría pisarla)
            _FORCE_FULL="${FORCE_FULL:-}"
            # Cargar .env — grep elimina comentarios y vacías antes de exportar
            export $(grep -v '^#' /home/deploy/.env | grep -v '^$' | xargs -d '\n') 2>/dev/null || true
            # Restaurar FORCE_FULL si fue inyectada por envs:
            if [ -n "$_FORCE_FULL" ]; then FORCE_FULL="$_FORCE_FULL"; fi
            COMPOSE="docker compose -f $REPO_DIR/docker-compose.prod.yml"

            echo "=== [1/4] Actualizar código ==="
            cd $REPO_DIR
            git fetch origin main
            PREV_SHA=$(git rev-parse --short HEAD)
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse --short HEAD)
            echo "  $PREV_SHA -> $NEW_SHA"

            # true si se pasó force_full=true en workflow_dispatch
            FORCE_FULL="${FORCE_FULL:-false}"
            BUILD_SERVICES=""
            RESTART_SERVICES=""

            if [ "$FORCE_FULL" = "true" ] || [ "$FORCE_FULL" = "1" ] || [ "$FORCE_FULL" = "yes" ]; then
              echo "=== Forzando deploy completo ==="
              BUILD_SERVICES="auth billing-webhook portal registry-server admin-api admin player"
              RESTART_SERVICES="redis clickhouse moq-relay krakend nginx prometheus grafana"
            else
              [ "${CHANGED_AUTH:-false}"     = "true" ] && BUILD_SERVICES="$BUILD_SERVICES auth"
              [ "${CHANGED_BILLING:-false}"  = "true" ] && BUILD_SERVICES="$BUILD_SERVICES billing-webhook"
              [ "${CHANGED_PORTAL:-false}"   = "true" ] && BUILD_SERVICES="$BUILD_SERVICES portal"
              [ "${CHANGED_REGISTRY:-false}" = "true" ] && BUILD_SERVICES="$BUILD_SERVICES registry-server"
              [ "${CHANGED_ADMIN:-false}"    = "true" ] && BUILD_SERVICES="$BUILD_SERVICES admin-api admin"
              [ "${CHANGED_PLAYER:-false}"   = "true" ] && BUILD_SERVICES="$BUILD_SERVICES player"
              [ "${CHANGED_INFRA:-false}"    = "true" ] && RESTART_SERVICES="$RESTART_SERVICES nginx"
              [ "${CHANGED_CONFIG:-false}"   = "true" ] && RESTART_SERVICES="$RESTART_SERVICES krakend prometheus grafana"
            fi

            BUILD_SERVICES=$(echo $BUILD_SERVICES | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
            ALL_RESTART=$(echo "$BUILD_SERVICES $RESTART_SERVICES" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')

            if [ -z "$ALL_RESTART" ]; then
              echo "Sin cambios relevantes para produccion. Skip."
              exit 0
            fi

            echo "=== [2/4] Build: ${BUILD_SERVICES:-ninguno} ==="
            if [ -n "$BUILD_SERVICES" ]; then
              $COMPOSE build --parallel $BUILD_SERVICES
            fi

            echo "=== [3/4] Restart: $ALL_RESTART ==="
            for svc in $ALL_RESTART; do
              $COMPOSE up -d --no-deps $svc && echo "  OK $svc" || echo "  WARN $svc"
            done

            echo "=== [4/4] Estado ==="
            $COMPOSE ps
            echo "Deploy $NEW_SHA OK — actualizados: $ALL_RESTART"
        env:
          CHANGED_AUTH:     ${{ needs.detect.outputs.auth }}
          CHANGED_BILLING:  ${{ needs.detect.outputs.billing }}
          CHANGED_PORTAL:   ${{ needs.detect.outputs.portal }}
          CHANGED_REGISTRY: ${{ needs.detect.outputs.registry }}
          CHANGED_ADMIN:    ${{ needs.detect.outputs.admin }}
          CHANGED_PLAYER:   ${{ needs.detect.outputs.player }}
          CHANGED_INFRA:    ${{ needs.detect.outputs.infra }}
          CHANGED_CONFIG:   ${{ needs.detect.outputs.config }}
          FORCE_FULL:       ${{ github.event.inputs.force_full || 'false' }}
